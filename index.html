<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND Animated Logo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #020805;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Background Grid Pattern */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
    }

    /* Dark vignette edge overlay */
    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #020805 85%);
      z-index: 2;
    }

    /* 2. Neon Ring behind Logo */
    .circle-ring {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 136, 0.25);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 255, 136, 0.15);
      z-index: 3;
    }

    /* 3. Animated EKG Heartbeat Line */
    .ekg-container {
      position: absolute;
      width: 100%;
      height: 120px;
      top: 36%;
      transform: translateY(-50%);
      z-index: 4;
      pointer-events: none;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
    }

    /* Dim base line */
    .ekg-back-line {
      stroke: rgba(0, 255, 136, 0.2);
      stroke-width: 2;
      fill: none;
    }

    /* Animated bright pulse line */
    .ekg-pulse-line {
      stroke: #00ff88;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px #00ff88) drop-shadow(0 0 16px #00ff88);
      stroke-dasharray: 200 1200;
      stroke-dashoffset: 1400;
      animation: ekgSweep 3s linear infinite;
    }

    @keyframes ekgSweep {
      0% {
        stroke-dashoffset: 1400;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* 4. Center Content */
    .logo-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-icon {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.8))
              drop-shadow(0 0 35px rgba(0, 255, 136, 0.4));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .logo-text {
      font-size: 3.2rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      color: #00ff88;
      text-transform: uppercase;
      text-shadow: 
        0 0 8px #00ff88,
        0 0 20px rgba(0, 255, 136, 0.8),
        3px 4px 0px #024021;
    }

    .enter-btn {
      margin-top: 25px;
      padding: 14px 45px;
      font-family: Georgia, serif;
      font-size: 1.2rem;
      font-style: italic;
      font-weight: bold;
      color: #030a06;
      background: linear-gradient(180deg, #00ff88 0%, #00b359 100%);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 
        0 0 15px rgba(0, 255, 136, 0.6),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
    }

    .enter-btn:hover {
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.9);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>

  <!-- Background Circle Ring -->
  <div class="circle-ring"></div>

  <!-- EKG Line Layer -->
  <div class="ekg-container">
    <svg class="ekg-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <!-- Path definition of EKG wave pattern -->
      <path id="ekgPath" d="
        M 0,60 H 350
        L 360,50 L 370,60 H 390
        L 400,20 L 415,100 L 430,10 L 445,75 L 455,60 H 480
        L 490,45 L 500,60 H 700
        L 710,50 L 720,60 H 740
        L 750,20 L 765,100 L 780,10 L 795,75 L 805,60 H 830
        L 840,45 L 850,60 H 1200" 
      />
      <!-- Static dimmed line -->
      <use href="#ekgPath" class="ekg-back-line" />
      <!-- Animated glowing signal path -->
      <use href="#ekgPath" class="ekg-pulse-line" />
    </svg>
  </div>

  <!-- Main Logo Content -->
  <div class="logo-wrapper">
    <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="greenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00ff88" />
          <stop offset="100%" stop-color="#00ab52" />
        </linearGradient>
      </defs>
      <path d="M 40 10 H 60 V 40 H 90 V 60 H 60 V 90 H 40 V 60 H 10 V 40 H 40 Z" fill="url(#greenGlow)" rx="3" />
      <circle cx="50" cy="50" r="21" fill="#031a0e" stroke="#00ff88" stroke-width="5" />
      <path d="M 64 64 L 78 78" stroke="#00ff88" stroke-width="8" stroke-linecap="round" />
      <path d="M 50 38 Q 50 50 62 50 Q 50 50 50 62 Q 50 50 38 50 Q 50 50 50 38 Z" fill="#00ff88" />
    </svg>

    <h1 class="logo-text">MEDIFIND</h1>
    <button class="enter-btn">Enter Platform</button>
  </div>

</body>
</html>
