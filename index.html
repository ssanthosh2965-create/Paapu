<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediFind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#FBFAF6;
    min-height:100vh;
  }
  body.locked{overflow:hidden; height:100vh;}

  #splash{
    position:fixed; inset:0; z-index:999;
    background:#08453A;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.6s ease, visibility 0.6s ease;
  }
  #splash.fade-out{opacity:0; visibility:hidden;}
  #splash .splash-mark{
    font-family:'Fraunces', serif; font-size:38px; font-weight:600; color:#fff;
    opacity:0;
    animation:splashIn 0.6s ease forwards;
  }
  @keyframes splashIn{
    to{opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    #splash .splash-mark{animation:none; opacity:1;}
  }
</style>
</head>
<body class="locked">

<div id="splash" role="img" aria-label="MediFind loading">
  <div class="splash-mark">MediFind</div>
</div>

<script>
  window.addEventListener('load', function(){
    setTimeout(function(){
      var splash = document.getElementById('splash');
      splash.classList.add('fade-out');
      document.body.classList.remove('locked');
      setTimeout(function(){ splash.remove(); }, 650);
    }, 3000);
  });
</script>
</body>
</html>
