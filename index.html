<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIFIND</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06090e;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* 3D Canvas Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Foreground Content */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* Logo Styling */
    .logo-box {
      width: 110px;
      height: 110px;
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 18px rgba(0, 230, 118, 0.5));
    }

    .logo-box svg {
      width: 100%;
      height: 100%;
    }

    /* App Title */
    .title {
      color: #00e676;
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 48px;
      font-style: italic;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.6);
    }

    /* Button Styling */
    .btn-enter {
      background-color: #00e676;
      color: #06090e;
      border: none;
      padding: 16px 44px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 230, 118, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn-enter:hover {
      transform: scale(1.04);
      background-color: #00ff87;
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.8);
    }
  </style>
</head>
<body>

  <!-- Three.js 3D Pulse Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- UI Interface Layer -->
  <div class="container">
    <div class="logo-box">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Medical Cross Base -->
        <path d="M 40 10 H 60 V 30 H 80 V 50 H 60 V 70 H 40 V 50 H 20 V 30 H 40 Z" fill="#00e676" />
        <!-- Center Magnifier Ring Cutout -->
        <circle cx="50" cy="40" r="16" fill="#06090e" />
        <circle cx="50" cy="40" r="13" fill="none" stroke="#00e676" stroke-width="3" />
        <!-- Sparkle Star in Center -->
        <path d="M 50 30 Q 50 40 60 40 Q 50 40 50 50 Q 50 40 40 40 Q 50 40 50 30 Z" fill="#00e676" />
        <!-- Magnifier Handle -->
        <rect x="61" y="53" width="9" height="24" rx="4.5" transform="rotate(-45 61 53)" fill="#00e676" />
      </svg>
    </div>

    <h1 class="title">MEDIFIND</h1>

    <button class="btn-enter">Enter Platform</button>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 75);

    // 1. 3D Particle Wave Mesh (Medical Matrix Grid)
    const countX = 55;
    const countY = 55;
    const numParticles = countX * countY;
    const positions = new Float32Array(numParticles * 3);

    let idx = 0;
    for (let ix = 0; ix < countX; ix++) {
      for (let iy = 0; iy < countY; iy++) {
        positions[idx] = (ix - countX / 2) * 3.2;
        positions[idx + 1] = (iy - countY / 2) * 3.2;
        positions[idx + 2] = 0;
        idx += 3;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00e676,
      size: 1.3,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending
    });

    const particleGrid = new THREE.Points(geometry, material);
    scene.add(particleGrid);

    // 2. Expanding 3D Radial Pulse Rings (Heartbeat / Radar Wave Effect)
    const ringCount = 4;
    const rings = [];

    for (let i = 0; i < ringCount; i++) {
      const ringGeo = new THREE.RingGeometry(1.5, 2.2, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ff87,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.z = -5;
      scene.add(ringMesh);
      rings.push({
        mesh: ringMesh,
        progress: i / ringCount
      });
    }

    // Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Undulate 3D Particle Grid with Radial Pulse Waves
      const posAttr = geometry.attributes.position;
      let ptr = 0;

      for (let ix = 0; ix < countX; ix++) {
        for (let iy = 0; iy < countY; iy++) {
          const dx = ix - countX / 2;
          const dy = iy - countY / 2;
          const dist = Math.sqrt(dx * dx + dy * dy);

          // Pulse wave equation propagating outward
          const wave = Math.sin(dist * 0.35 - elapsed * 4.5) * 4.5;
          posAttr.array[ptr + 2] = wave;
          ptr += 3;
        }
      }
      posAttr.needsUpdate = true;

      // Animate Radial Pulse Rings (Heartbeat Expansion)
      rings.forEach(ring => {
        ring.progress += 0.007;
        if (ring.progress > 1) ring.progress = 0;

        const currentScale = ring.progress * 38;
        ring.mesh.scale.set(currentScale, currentScale, 1);

        // Dynamic Opacity Fade
        if (ring.progress < 0.25) {
          ring.mesh.material.opacity = ring.progress * 2.5;
        } else {
          ring.mesh.material.opacity = (1 - ring.progress) * 0.5;
        }
      });

      // Subtle slow 3D rotation
      particleGrid.rotation.z = elapsed * 0.04;

      renderer.render(scene, camera);
    }

    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
