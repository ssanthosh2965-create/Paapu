<!DOCTYPE html>
<html>
<head>
  <style>
    /* 1. Cover the whole screen with a dark blue background */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #030d28; 
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s; /* Smooth fade out */
    }

    /* 2. Make the logo image fit the screen nicely */
    #splash img {
      max-width: 80%;
      max-height: 80%;
    }

    /* 3. Hide the splash screen */
    .hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- The Splash Screen with your picture -->
  <div id="splash">
    <img src="logo.jpg" alt="MediFind Logo">
  </div>

  <!-- Your actual home page content -->
  <h1>Welcome to MediFind</h1>
  <p>This is your home page content behind the splash screen.</p>

  <script>
    // Wait 3 seconds, then fade out the splash screen
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
    }, 3000);
  </script>

</body>
</html>
