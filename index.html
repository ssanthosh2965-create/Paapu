<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIFIND - Professional Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060b13;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    /* Modern Professional Medical Grid & Radial Glow Background */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 50% 45%, rgba(0, 230, 118, 0.12) 0%, rgba(6, 11, 19, 0.95) 70%),
        linear-gradient(rgba(0, 230, 118, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 230, 118, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      background-position: center, center, center;
      z-index: 1;
    }

    /* Faint Ambient Ambient Pulse Circle */
    .bg-glow-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      border-radius: 50%;
      border: 1px solid rgba(0, 230, 118, 0.15);
      box-shadow: 0 0 60px rgba(0, 230, 118, 0.08);
      animation: ambientPulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ambientPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.4;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.8;
      }
    }

    /* Content Layer */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* Logo Styling */
    .logo-box {
      width: 110px;
      height: 110px;
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 22px rgba(0, 230, 118, 0.65));
    }

    .logo-box svg {
      width: 100%;
      height: 100%;
    }

    /* App Title */
    .title {
      color: #00e676;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 44px;
      font-style: italic;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      text-shadow: 0 0 25px rgba(0, 230, 118, 0.7);
    }

    /* Button Styling */
    .btn-enter {
      background: #00e676;
      color: #060b13;
      border: none;
      padding: 18px 48px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 230, 118, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn-enter:hover {
      transform: scale(1.05);
      background: #00ff87;
      box-shadow: 0 0 45px rgba(0, 230, 118, 0.85);
    }
  </style>
</head>
<body>

  <!-- Clean Background Layer -->
  <div class="bg-wrapper">
    <div class="bg-glow-ring"></div>
  </div>

  <!-- User Interface Layer -->
  <div class="container">
    <div class="logo-box">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 40 10 H 60 V 30 H 80 V 50 H 60 V 70 H 40 V 50 H 20 V 30 H 40 Z" fill="#00e676" />
        <circle cx="50" cy="40" r="16" fill="#060b13" />
        <circle cx="50" cy="40" r="13" fill="none" stroke="#00e676" stroke-width="3" />
        <path d="M 50 30 Q 50 40 60 40 Q 50 40 50 50 Q 50 40 40 40 Q 50 40 50 30 Z" fill="#00e676" />
        <rect x="61" y="53" width="9" height="24" rx="4.5" transform="rotate(-45 61 53)" fill="#00e676" />
      </svg>
    </div>

    <h1 class="title">MEDIFIND</h1>

    <button class="btn-enter">Enter Platform</button>
  </div>

</body>
</html>
