<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #010810;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #062a3e 0%, #02111a 60%, #000508 100%);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* CENTER BRAND AREA */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 2;
    }

    /* LOGO WRAPPER / EMERGENCY BUTTON */
    .logo-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .logo-wrapper:active {
      transform: scale(0.92);
    }

    /* PULSING GLOW IN BACKGROUND */
    .logo-glow {
      position: absolute;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.4) 0%, rgba(0, 210, 255, 0.2) 50%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      animation: glowPulse 0.6s ease-out 1.2s forwards;
    }

    @keyframes glowPulse {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    /* 4 CORNER PIECES ANIMATION */
    .logo-piece {
      position: absolute;
      width: 100%;
      height: 100%;
      will-change: transform, opacity;
      animation-duration: 1.2s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      animation-fill-mode: forwards;
    }

    .piece-tl { opacity: 0; animation-name: flyTopLeft; }
    @keyframes flyTopLeft {
      0% { opacity: 0; transform: translate(-300px, -300px) rotate(-360deg) scale(0.3); }
      100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    .piece-tr { opacity: 0; animation-name: flyTopRight; }
    @keyframes flyTopRight {
      0% { opacity: 0; transform: translate(300px, -300px) rotate(360deg) scale(0.3); }
      100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    .piece-bl { opacity: 0; animation-name: flyBottomLeft; }
    @keyframes flyBottomLeft {
      0% { opacity: 0; transform: translate(-300px, 300px) rotate(360deg) scale(0.3); }
      100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    .piece-br { opacity: 0; animation-name: flyBottomRight; }
    @keyframes flyBottomRight {
      0% { opacity: 0; transform: translate(300px, 300px) rotate(-360deg) scale(0.3); }
      100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    /* CENTER SOS TEXT */
    .sos-text {
      position: absolute;
      z-index: 5;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ff3344;
      text-shadow: 0 0 10px rgba(255, 51, 68, 0.6);
      opacity: 0;
      animation: sosFadeIn 0.5s ease-out 1.2s forwards;
    }

    @keyframes sosFadeIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ROTATING DASHED TECH RING */
    .logo-ring {
      position: absolute;
      width: 115%;
      height: 115%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 210, 255, 0.5);
      opacity: 0;
      animation: ringFadeIn 0.5s ease-out 1.2s forwards, spinRing 8s linear 1.2s infinite;
    }

    @keyframes ringFadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* DOUBLE CLICK HINT LABEL */
    .double-click-hint {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      opacity: 0;
      animation: textReveal 0.8s ease-out 1.1s forwards;
      margin-top: -5px;
    }

    /* TEXT BRANDING */
    .text-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: textReveal 0.8s ease-out 1.1s forwards;
    }

    @keyframes textReveal {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .brand-title {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      line-height: 1;
      display: flex;
    }

    .brand-title .medi { color: #00d2ff; }
    .brand-title .find { color: #00ffcc; }

    .brand-tagline {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      opacity: 0.9;
      text-transform: uppercase;
    }

    /* EMERGENCY ACTIVATED STATE (RED FLASH) */
    .app-container.emergency-active {
      animation: alertPulse 0.8s infinite alternate;
    }

    @keyframes alertPulse {
      0% { background: radial-gradient(circle at 50% 45%, #4a0307 0%, #1a0204 60%, #000508 100%); }
      100% { background: radial-gradient(circle at 50% 45%, #7a080e 0%, #2e0306 60%, #000508 100%); }
    }

    .emergency-status {
      position: absolute;
      bottom: 50px;
      background: rgba(255, 51, 68, 0.2);
      border: 1px solid #ff3344;
      padding: 12px 24px;
      border-radius: 30px;
      color: #ff4d5e;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(255, 51, 68, 0.4);
    }

    .emergency-status.show {
      display: flex;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">

    <!-- BRAND LOGO AREA -->
    <div class="brand-section">
      
      <!-- LOGO ACTS AS EMERGENCY BUTTON -->
      <div class="logo-wrapper" id="emergencyBtn">
        <div class="logo-glow"></div>
        <div class="logo-ring"></div>
        
        <!-- CENTER SOS TEXT -->
        <div class="sos-text" id="sosText">SOS</div>

        <!-- TOP-LEFT PIECE -->
        <svg class="logo-piece piece-tl" viewBox="0 0 100 100">
          <g clip-path="url(#clip-tl)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
          </g>
          <defs>
            <clipPath id="clip-tl"><rect x="0" y="0" width="50" height="50" /></clipPath>
          </defs>
        </svg>

        <!-- TOP-RIGHT PIECE -->
        <svg class="logo-piece piece-tr" viewBox="0 0 100 100">
          <g clip-path="url(#clip-tr)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
          </g>
          <defs>
            <clipPath id="clip-tr"><rect x="50" y="0" width="50" height="50" /></clipPath>
          </defs>
        </svg>

        <!-- BOTTOM-LEFT PIECE -->
        <svg class="logo-piece piece-bl" viewBox="0 0 100 100">
          <g clip-path="url(#clip-bl)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
          </g>
          <defs>
            <clipPath id="clip-bl"><rect x="0" y="50" width="50" height="50" /></clipPath>
          </defs>
        </svg>

        <!-- BOTTOM-RIGHT PIECE -->
        <svg class="logo-piece piece-br" viewBox="0 0 100 100">
          <g clip-path="url(#clip-br)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
          </g>
          <defs>
            <clipPath id="clip-br"><rect x="50" y="50" width="50" height="50" /></clipPath>
          </defs>
        </svg>

      </div>

      <div class="double-click-hint">Double Tap Logo for Emergency</div>

      <!-- TEXT BRANDING -->
      <div class="text-container">
        <div class="brand-title">
          <span class="medi">MEDI</span><span class="find">FIND</span>
        </div>

        <div class="brand-tagline">
          Healthcare. Discovered.
        </div>
      </div>

    </div>

    <!-- EMERGENCY ALERT BANNER -->
    <div class="emergency-status" id="emergencyStatus">
      <span>🚨 EMERGENCY REQUEST SENT</span>
    </div>

  </div>

  <script>
    const emergencyBtn = document.getElementById('emergencyBtn');
    const appContainer = document.getElementById('appContainer');
    const emergencyStatus = document.getElementById('emergencyStatus');
    const sosText = document.getElementById('sosText');

    let lastTap = 0;

    emergencyBtn.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;

      // Detect Double Tap / Double Click
      if (tapLength < 400 && tapLength > 0) {
        triggerEmergency();
        e.preventDefault();
      }
      lastTap = currentTime;
    });

    function triggerEmergency() {
      appContainer.classList.add('emergency-active');
      emergencyStatus.classList.add('show');
      sosText.style.color = '#ffffff';
      sosText.style.textShadow = '0 0 15px #ffffff';
      
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
    }
  </script>

</body>
</html>
