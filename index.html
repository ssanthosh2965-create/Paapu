<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIFIND - Red 3D Heartbeat Pulse</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06090e;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* 3D Canvas Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Foreground Content */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* Audio Toggle Button */
    .audio-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      background: rgba(6, 9, 14, 0.7);
      border: 1px solid #ff1744;
      color: #ff1744;
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 23, 68, 0.3);
      transition: all 0.3s ease;
    }

    .audio-toggle:hover {
      background: rgba(255, 23, 68, 0.2);
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.6);
      transform: scale(1.05);
    }

    .audio-toggle.active {
      background: #ff1744;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.8);
    }

    /* Logo Styling */
    .logo-box {
      width: 110px;
      height: 110px;
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 20px rgba(0, 230, 118, 0.65));
    }

    .logo-box svg {
      width: 100%;
      height: 100%;
    }

    /* App Title */
    .title {
      color: #00e676;
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 48px;
      font-style: italic;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      text-shadow: 0 0 22px rgba(0, 230, 118, 0.7);
    }

    /* Button Styling */
    .btn-enter {
      background-color: #00e676;
      color: #06090e;
      border: none;
      padding: 16px 44px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 230, 118, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn-enter:hover {
      transform: scale(1.04);
      background-color: #00ff87;
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.85);
    }
  </style>
</head>
<body>

  <!-- Three.js Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Audio Toggle Control -->
  <button id="audio-btn" class="audio-toggle">
    <span id="audio-icon">🔇</span>
    <span id="audio-text">Audio: Off</span>
  </button>

  <!-- UI Interface Layer -->
  <div class="container">
    <div class="logo-box">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 40 10 H 60 V 30 H 80 V 50 H 60 V 70 H 40 V 50 H 20 V 30 H 40 Z" fill="#00e676" />
        <circle cx="50" cy="40" r="16" fill="#06090e" />
        <circle cx="50" cy="40" r="13" fill="none" stroke="#00e676" stroke-width="3" />
        <path d="M 50 30 Q 50 40 60 40 Q 50 40 50 50 Q 50 40 40 40 Q 50 40 50 30 Z" fill="#00e676" />
        <rect x="61" y="53" width="9" height="24" rx="4.5" transform="rotate(-45 61 53)" fill="#00e676" />
      </svg>
    </div>

    <h1 class="title">MEDIFIND</h1>

    <button class="btn-enter">Enter Platform</button>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- 1. Web Audio API Synthesizer ---
    let audioCtx = null;
    let isAudioEnabled = false;
    let lastBeatTriggerTime = 0;

    const audioBtn = document.getElementById('audio-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioText = document.getElementById('audio-text');

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playHeartbeatSound() {
      if (!isAudioEnabled || !audioCtx) return;

      const now = audioCtx.currentTime;

      // LUB (Low Pitch)
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(55, now);
      osc1.frequency.exponentialRampToValueAtTime(25, now + 0.12);
      gain1.gain.setValueAtTime(0.7, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.12);

      // DUB (Slightly Higher)
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(75, now + 0.13);
      osc2.frequency.exponentialRampToValueAtTime(30, now + 0.23);
      gain2.gain.setValueAtTime(0, now);
      gain2.gain.setValueAtTime(0.5, now + 0.13);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.13);
      osc2.stop(now + 0.23);
    }

    audioBtn.addEventListener('click', () => {
      initAudio();
      isAudioEnabled = !isAudioEnabled;

      if (isAudioEnabled) {
        audioBtn.classList.add('active');
        audioIcon.textContent = '🔊';
        audioText.textContent = 'Audio: On';
        playHeartbeatSound();
      } else {
        audioBtn.classList.remove('active');
        audioIcon.textContent = '🔇';
        audioText.textContent = 'Audio: Off';
      }
    });

    // --- 2. Three.js Setup ---
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 75);

    // Green Matrix Particle Background
    const countX = 50, countY = 50;
    const numParticles = countX * countY;
    const gridPositions = new Float32Array(numParticles * 3);

    let idx = 0;
    for (let ix = 0; ix < countX; ix++) {
      for (let iy = 0; iy < countY; iy++) {
        gridPositions[idx] = (ix - countX / 2) * 3.4;
        gridPositions[idx + 1] = (iy - countY / 2) * 3.4;
        gridPositions[idx + 2] = -10;
        idx += 3;
      }
    }

    const gridGeometry = new THREE.BufferGeometry();
    gridGeometry.setAttribute('position', new THREE.BufferAttribute(gridPositions, 3));

    const gridMaterial = new THREE.PointsMaterial({
      color: 0x00e676,
      size: 1.1,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending
    });

    const particleGrid = new THREE.Points(gridGeometry, gridMaterial);
    scene.add(particleGrid);

    // Green Radial Pulse Rings
    const ringCount = 3;
    const rings = [];

    for (let i = 0; i < ringCount; i++) {
      const ringGeo = new THREE.RingGeometry(1.5, 2.2, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ff87,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.z = -5;
      scene.add(ringMesh);
      rings.push({ mesh: ringMesh, progress: i / ringCount });
    }

    // 3D ECG Line - RED COLOR (#ff1744 / 0xff1744)
    const ecgSegments = 400;
    const ecgPositions = new Float32Array(ecgSegments * 3);
    const ecgGeometry = new THREE.BufferGeometry();
    ecgGeometry.setAttribute('position', new THREE.BufferAttribute(ecgPositions, 3));

    const ecgMaterial = new THREE.LineBasicMaterial({
      color: 0xff1744, // Bright Crimson Red
      linewidth: 3.5,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });

    const ecgLine = new THREE.Line(ecgGeometry, ecgMaterial);
    ecgLine.position.z = 10;
    scene.add(ecgLine);

    // Glowing Crimson Pulse Tracer Dot
    const tracerGeo = new THREE.SphereGeometry(1.4, 16, 16);
    const tracerMat = new THREE.MeshBasicMaterial({
      color: 0xff5252, // Bright Glowing Neon Red
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending
    });
    const tracerDot = new THREE.Mesh(tracerGeo, tracerMat);
    scene.add(tracerDot);

    // ECG Heartbeat Shape Formula
    function getEcgY(phase) {
      const p = ((phase % 40) + 40) % 40;
      if (p > 12 && p <= 14) return Math.sin((p - 12) / 2 * Math.PI) * 1.5;     // P wave
      if (p > 15 && p <= 16) return -2.0;                                        // Q wave
      if (p > 16 && p <= 18) return (p - 16) == 1 ? 14.0 : -4.0;                // R Peak Spike
      if (p > 18 && p <= 20) return -3.5 + (p - 18) * 1.75;                     // S wave
      if (p > 22 && p <= 26) return Math.sin((p - 22) / 4 * Math.PI) * 3.2;     // T wave
      return 0;
    }

    // --- 3. Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Update Matrix Particles
      const gridAttr = gridGeometry.attributes.position;
      let ptr = 0;
      for (let ix = 0; ix < countX; ix++) {
        for (let iy = 0; iy < countY; iy++) {
          const dx = ix - countX / 2;
          const dy = iy - countY / 2;
          const dist = Math.sqrt(dx * dx + dy * dy);
          gridAttr.array[ptr + 2] = -10 + Math.sin(dist * 0.35 - elapsed * 4) * 4;
          ptr += 3;
        }
      }
      gridAttr.needsUpdate = true;

      // Update Radial Pulse Rings
      rings.forEach(ring => {
        ring.progress += 0.006;
        if (ring.progress > 1) ring.progress = 0;
        const scale = ring.progress * 42;
        ring.mesh.scale.set(scale, scale, 1);
        ring.mesh.material.opacity = ring.progress < 0.25 
          ? ring.progress * 3.2 
          : (1 - ring.progress) * 0.65;
      });

      // Update RED ECG Heartbeat Line
      const ecgAttr = ecgGeometry.attributes.position;
      const speed = elapsed * 28;
      const totalWidth = 110;

      let leadX = 0, leadY = 0, leadZ = 0;
      let peakDetected = false;

      const tracerSampleIndex = Math.floor(ecgSegments * 0.82);

      for (let i = 0; i < ecgSegments; i++) {
        const x = (i / ecgSegments) * totalWidth - totalWidth / 2;
        const phase = x + speed;
        const y = getEcgY(phase);
        const z = Math.sin(x * 0.05 + elapsed) * 3;

        ecgAttr.array[i * 3] = x;
        ecgAttr.array[i * 3 + 1] = y;
        ecgAttr.array[i * 3 + 2] = z;

        if (i === tracerSampleIndex) {
          leadX = x;
          leadY = y;
          leadZ = z + 10;

          if (y > 8.0) {
            peakDetected = true;
          }
        }
      }
      ecgAttr.needsUpdate = true;

      // Sync Audio Pulse
      if (peakDetected && (elapsed - lastBeatTriggerTime > 0.4)) {
        playHeartbeatSound();
        lastBeatTriggerTime = elapsed;
      }

      // Update Glowing Red Tracer Position
      tracerDot.position.set(leadX, leadY, leadZ);

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
