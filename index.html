<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #010603;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* Page View Containers */
    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    /* SCREEN 1: LANDING PAGE */
    #landing-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #010603;
      overflow: hidden;
      z-index: 10;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #010603 88%);
      z-index: 2;
      pointer-events: none;
    }

    .ekg-container {
      position: absolute;
      width: 100%;
      height: 220px;
      top: 36%;
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: none;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
    }

    .ekg-back-line {
      stroke: rgba(255, 0, 51, 0.25);
      stroke-width: 3.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #ff0033;
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 250 1100;
      stroke-dashoffset: 1350;
      animation: ekgSweep 2.5s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1350; }
      100% { stroke-dashoffset: 0; }
    }

    .logo-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    .vector-logo {
      width: 100%;
      height: auto;
      shape-rendering: geometricPrecision;
      pointer-events: none;
    }

    .enter-btn {
      position: relative;
      z-index: 10;
      margin-top: 12px;
      padding: 14px 44px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1.5px solid #7effc3;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      pointer-events: auto;
    }

    .enter-btn:hover {
      box-shadow: 0 6px 20px rgba(0, 255, 136, 0.6);
      transform: translateY(-2px);
    }

    .enter-btn:active {
      transform: scale(0.96);
    }

    /* SCREEN 2: MAIN PLATFORM UI */
    #platform-screen {
      display: none;
      justify-content: center;
      background-color: #f6f8f5;
      padding: 32px 20px;
      opacity: 0;
      transform: translateY(15px);
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background-color: #0f5b49;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .brand-title {
      font-family: 'Newsreader', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: #1a2b3c;
    }

    /* VERTICAL STEPPER COMPONENT */
    .stepper {
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      margin-top: 8px;
    }

    .step-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .step-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 1.5px solid #dcdfe3;
      color: #718096;
      flex-shrink: 0;
    }

    .step-item.active .step-icon {
      background-color: #0f5b49;
      border-color: #0f5b49;
      color: #ffffff;
    }

    .step-label {
      font-family: 'Newsreader', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: #718096;
      text-align: left;
      line-height: 1.2;
    }

    .step-item.active .step-label {
      color: #1a2b3c;
      font-weight: 600;
    }

    .stepper-lines {
      position: absolute;
      top: 24px;
      bottom: 24px;
      left: 23px;
      width: 2px;
      background-color: #dcdfe3;
      z-index: 1;
    }

    /* Screen Transition Animation Classes */
    .fade-out {
      opacity: 0;
      transform: scale(0.97);
    }

    .fade-in {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
  </style>
</head>
<body>

  <!-- PAGE 1: LANDING LOGO SCREEN -->
  <div id="landing-screen" class="screen">
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>

    <div class="ekg-container">
      <svg class="ekg-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
        <path class="ekg-back-line" d="M 0,100 H 300 L 315,85 L 330,100 H 360 L 375,25 L 395,185 L 415,10 L 435,145 L 450,100 H 490 L 505,75 L 520,100 H 680 L 695,85 L 710,100 H 740 L 755,25 L 775,185 L 795,10 L 815,145 L 830,100 H 870 L 885,75 L 900,100 H 1200" />
        <path class="ekg-pulse-line" d="M 0,100 H 300 L 315,85 L 330,100 H 360 L 375,25 L 395,185 L 415,10 L 435,145 L 450,100 H 490 L 505,75 L 520,100 H 680 L 695,85 L 710,100 H 740 L 755,25 L 775,185 L 795,10 L 815,145 L 830,100 H 870 L 885,75 L 900,100 H 1200" />
      </svg>
    </div>

    <div class="logo-wrapper">
      <svg class="vector-logo" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" />
            <stop offset="100%" stop-color="#00cc6a" />
          </linearGradient>

          <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#006635" />
            <stop offset="100%" stop-color="#00331b" />
          </linearGradient>

          <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" />
            <stop offset="100%" stop-color="#00d672" />
          </linearGradient>
        </defs>

        <g transform="translate(48, 25) scale(0.76)">
          <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#sideGrad)" transform="translate(10, 14)" />
          <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#frontGrad)" rx="3" />

          <circle cx="200" cy="125" r="42" fill="#010603" stroke="url(#sideGrad)" stroke-width="8" transform="translate(4, 5)" />
          <circle cx="200" cy="125" r="42" fill="#010e07" stroke="#00ff88" stroke-width="7" />
          
          <path d="M 230 155 L 265 190" stroke="#00331b" stroke-width="16" stroke-linecap="round" transform="translate(5, 7)" />
          <path d="M 230 155 L 265 190" stroke="#00ff88" stroke-width="14" stroke-linecap="round" />

          <path d="M 200 97 Q 200 125 228 125 Q 200 125 200 153 Q 200 125 172 125 Q 200 125 200 97 Z" fill="#ffffff" />
        </g>

        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="#00331b" transform="translate(5, 5)">MEDIFIND</text>
        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="#006635" transform="translate(3, 3)">MEDIFIND</text>
        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="#00994f" transform="translate(1, 1)">MEDIFIND</text>

        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="url(#textGrad)">MEDIFIND</text>
      </svg>

      <button id="enterBtn" class="enter-btn" onclick="openPlatform()">Enter Platform</button>
    </div>
  </div>


  <!-- PAGE 2: PLATFORM SCREEN -->
  <div id="platform-screen" class="screen">
    <div class="app-container">

      <header class="brand-header">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
            <path d="m8.5 8.5 7 7"/>
          </svg>
        </div>
        <h1 class="brand-title">MediFind</h1>
      </header>

      <!-- VERTICAL STEPPER ONLY -->
      <div class="stepper">
        <div class="stepper-lines"></div>

        <div class="step-item active">
          <div class="step-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.3.3 0 1 0 .2.3"/>
              <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
              <circle cx="20" cy="10" r="2"/>
            </svg>
          </div>
          <span class="step-label">Find doctor</span>
        </div>

        <div class="step-item">
          <div class="step-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
          </div>
          <span class="step-label">Upload prescription</span>
        </div>

        <div class="step-item">
          <div class="step-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
              <path d="m8.5 8.5 7 7"/>
            </svg>
          </div>
          <span class="step-label">Find pharmacy</span>
        </div>

        <div class="step-item">
          <div class="step-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span class="step-label">Confirm</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    function openPlatform() {
      const landingScreen = document.getElementById('landing-screen');
      const platformScreen = document.getElementById('platform-screen');

      // 1. Fade out landing screen
      landingScreen.classList.add('fade-out');

      // 2. Hide landing & show platform screen
      setTimeout(() => {
        landingScreen.style.display = 'none';
        platformScreen.style.display = 'flex';

        // 3. Trigger fade in transition
        setTimeout(() => {
          platformScreen.classList.add('fade-in');
        }, 20);
      }, 500);
    }
  </script>
</body>
</html>
