<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND</title>
  
  <!-- Crisp Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@1,6..72,700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #010603;
      overflow: hidden;
      position: relative;
    }

    /* Razor-Sharp Grid Lines */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.09) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, #010603 90%);
      z-index: 2;
    }

    /* Crisp Ring */
    .circle-ring {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 1.5px solid #00ff88;
      opacity: 0.35;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
      z-index: 3;
    }

    /* EKG Pulse Line */
    .ekg-container {
      position: absolute;
      width: 100%;
      height: 100px;
      top: 38%;
      transform: translateY(-50%);
      z-index: 4;
      pointer-events: none;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
    }

    .ekg-back-line {
      stroke: rgba(0, 255, 136, 0.25);
      stroke-width: 1.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #00ff88;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 180 1000;
      stroke-dashoffset: 1180;
      animation: ekgSweep 2.8s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1180; }
      100% { stroke-dashoffset: 0; }
    }

    /* Main Content Wrapper */
    .logo-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .logo-icon {
      width: 130px;
      height: 130px;
      shape-rendering: geometricPrecision;
    }

    /* Clean 3D Sharp Text */
    .logo-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      color: #00ff88;
      text-transform: uppercase;
      text-shadow: 
        1px 1px 0px #00cc6d,
        2px 2px 0px #009952,
        3px 3px 0px #006637,
        4px 4px 0px #00331c,
        0 0 12px rgba(0, 255, 136, 0.3);
    }

    /* Sharp Button */
    .enter-btn {
      margin-top: 15px;
      padding: 14px 42px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1px solid #7effc3;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 
        0 4px 15px rgba(0, 255, 136, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease;
    }

    .enter-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="circle-ring"></div>

  <!-- EKG Line -->
  <div class="ekg-container">
    <svg class="ekg-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path class="ekg-back-line" d="M 0,60 H 350 L 360,50 L 370,60 H 390 L 400,20 L 415,100 L 430,10 L 445,75 L 455,60 H 480 L 490,45 L 500,60 H 700 L 710,50 L 720,60 H 740 L 750,20 L 765,100 L 780,10 L 795,75 L 805,60 H 830 L 840,45 L 850,60 H 1200" />
      <path class="ekg-pulse-line" d="M 0,60 H 350 L 360,50 L 370,60 H 390 L 400,20 L 415,100 L 430,10 L 445,75 L 455,60 H 480 L 490,45 L 500,60 H 700 L 710,50 L 720,60 H 740 L 750,20 L 765,100 L 780,10 L 795,75 L 805,60 H 830 L 840,45 L 850,60 H 1200" />
    </svg>
  </div>

  <!-- Main Logo & Button -->
  <div class="logo-wrapper">
    <!-- Vector-Extruded Sharp 3D Cross SVG -->
    <svg class="logo-icon" viewBox="0 0 120 120" fill="none">
      <defs>
        <linearGradient id="frontGreen" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00ff88" />
          <stop offset="100%" stop-color="#00cc6d" />
        </linearGradient>
        <linearGradient id="sideGreen" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#008848" />
          <stop offset="100%" stop-color="#004d28" />
        </linearGradient>
      </defs>

      <!-- 3D Side Facets for Sharp Depth -->
      <path d="M 45 15 H 65 V 45 H 95 V 65 H 70 V 95 H 50 V 65 H 20 V 45 H 45 Z" fill="url(#sideGreen)" transform="translate(4, 5)" />

      <!-- Main Front Face -->
      <path d="M 45 10 H 65 V 40 H 95 V 60 H 65 V 90 H 45 V 60 H 15 V 40 H 45 Z" fill="url(#frontGreen)" rx="2" />

      <!-- Magnifying Glass -->
      <circle cx="55" cy="50" r="20" fill="#010e07" stroke="#00ff88" stroke-width="4.5" />
      <path d="M 69 64 L 83 78" stroke="#004d28" stroke-width="8" stroke-linecap="round" transform="translate(2, 2)" />
      <path d="M 69 64 L 83 78" stroke="#00ff88" stroke-width="7" stroke-linecap="round" />

      <!-- Center Star Sparkle -->
      <path d="M 55 38 Q 55 50 67 50 Q 55 50 55 62 Q 55 50 43 50 Q 55 50 55 38 Z" fill="#ffffff" />
    </svg>

    <h1 class="logo-text">MEDIFIND</h1>
    <button class="enter-btn">Enter Platform</button>
  </div>

</body>
</html>
