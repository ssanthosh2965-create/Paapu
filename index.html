<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #0a1727 0%, #030811 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    /* Main Container */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 320px;
      transform: translateY(-30px);
    }

    /* Logo Area Wrapper */
    .logo-area {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 4 Corner Search SVGs Flying In */
    .corner-search {
      position: absolute;
      width: 28px;
      height: 28px;
      color: #00ff88;
      filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.8));
      opacity: 0;
      animation-duration: 1.2s;
      animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1);
      animation-fill-mode: forwards;
    }

    .corner-tl { animation-name: flyTL; }
    .corner-tr { animation-name: flyTR; }
    .corner-bl { animation-name: flyBL; }
    .corner-br { animation-name: flyBR; }

    @keyframes flyTL {
      0% { transform: translate(-50vw, -50vh) scale(0.5); opacity: 0; }
      60% { opacity: 1; }
      90% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(0, 0) scale(0); opacity: 0; }
    }

    @keyframes flyTR {
      0% { transform: translate(50vw, -50vh) scale(0.5); opacity: 0; }
      60% { opacity: 1; }
      90% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(0, 0) scale(0); opacity: 0; }
    }

    @keyframes flyBL {
      0% { transform: translate(-50vw, 50vh) scale(0.5); opacity: 0; }
      60% { opacity: 1; }
      90% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(0, 0) scale(0); opacity: 0; }
    }

    @keyframes flyBR {
      0% { transform: translate(50vw, 50vh) scale(0.5); opacity: 0; }
      60% { opacity: 1; }
      90% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(0, 0) scale(0); opacity: 0; }
    }

    /* Combined Logo SVG - Search lens positioned at top-right of plus symbol */
    .main-logo-svg {
      width: 120px;
      height: 120px;
      color: #00ff88;
      filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.85));
      opacity: 0;
      transform: scale(0.2);
      animation: formLogo 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.1s forwards;
    }

    @keyframes formLogo {
      0% { opacity: 0; transform: scale(0.2); }
      50% { filter: drop-shadow(0 0 45px rgba(0, 255, 136, 1)); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Brand Title */
    .brand-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: revealElement 0.8s ease-out 1.6s forwards;
    }

    /* Enter Button */
    .enter-btn {
      width: 100%;
      background: linear-gradient(135deg, #00b359 0%, #00ff88 100%);
      color: #030811;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.45);
      opacity: 0;
      transform: translateY(25px);
      animation: revealElement 0.8s ease-out 2.1s forwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.75);
    }

    .enter-btn:active {
      transform: translateY(0) !important;
    }

    @keyframes revealElement {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-area">
      <!-- 4 Corner Converging Search SVGs -->
      <svg class="corner-search corner-tl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg>
      <svg class="corner-search corner-tr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg>
      <svg class="corner-search corner-bl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg>
      <svg class="corner-search corner-br" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20L16 16"/></svg>

      <!-- Main Combined Logo: Plus Symbol with Search Lens on Top-Right -->
      <svg class="main-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Medical Plus Cross Base -->
        <path d="M30 16H50V32H66V52H50V72H30V52H14V32H30V16Z" fill="currentColor"/>
        
        <!-- Search Lens positioned over top-right quadrant -->
        <circle cx="52" cy="38" r="19" stroke="#00ff88" stroke-width="4.5" fill="#0a1727"/>
        
        <!-- Lens Handle extending bottom-right -->
        <path d="M66 52L83 69" stroke="#00ff88" stroke-width="5.5" stroke-linecap="round"/>
        
        <!-- Star Sparkle inside Search Lens -->
        <path d="M52 27C52 33 46 38 40 38C46 38 52 43 52 49C52 43 58 38 64 38C58 38 52 33 52 27Z" fill="#00ff88"/>
      </svg>
    </div>
    
    <h1 class="brand-title">MEDIFIND</h1>

    <button class="enter-btn">Enter Platform</button>
  </div>

</body>
</html>
