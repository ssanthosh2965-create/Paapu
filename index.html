<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIFIND - 3D DNA Background</title>
  <!-- Three.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #06090e;
      color: #ffffff;
    }

    /* WebGL Canvas Background */
    #dna-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Foreground Content */
    .hero-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle at center, rgba(6, 9, 14, 0.3) 0%, rgba(6, 9, 14, 0.85) 100%);
    }

    .logo-wrapper {
      width: 90px;
      height: 90px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 15px rgba(0, 230, 118, 0.5));
      animation: float 4s ease-in-out infinite;
    }

    .logo-wrapper svg {
      width: 100%;
      height: 100%;
      fill: #00e676;
    }

    .title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #00e676;
      text-shadow: 0 0 25px rgba(0, 230, 118, 0.4);
      margin-bottom: 40px;
      font-family: 'Georgia', serif;
    }

    .enter-btn {
      background: #00e676;
      color: #06090e;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 48px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 230, 118, 0.6);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: #33eb91;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 40px rgba(0, 230, 118, 0.9);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Three.js 3D Background Canvas -->
  <canvas id="dna-canvas"></canvas>

  <!-- Foreground Interface -->
  <main class="hero-container">
    <div class="logo-wrapper">
      <svg viewBox="0 0 100 100">
        <path d="M 45 10 H 55 V 35 H 80 V 45 H 55 V 55 H 80 V 65 H 55 V 90 H 45 V 65 H 20 V 55 H 45 V 45 H 20 V 35 H 45 Z" />
        <circle cx="50" cy="50" r="30" fill="none" stroke="#00e676" stroke-width="8" />
        <line x1="70" y1="70" x2="90" y2="90" stroke="#00e676" stroke-width="10" stroke-linecap="round" />
        <path d="M 50 42 L 53 47 L 58 50 L 53 53 L 50 58 L 47 53 L 42 50 L 47 47 Z" fill="#06090e" />
      </svg>
    </div>

    <h1 class="title">MEDIFIND</h1>

    <button class="enter-btn">Enter Platform</button>
  </main>

  <script>
    // 1. Scene, Camera, Renderer Setup
    const canvas = document.getElementById('dna-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 14;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 2. DNA Construction
    const dnaGroup = new THREE.Group();
    // Tilt the entire helix slightly for diagonal presentation
    dnaGroup.rotation.z = Math.PI / 6;
    scene.add(dnaGroup);

    const totalNodes = 70;
    const radius = 2.8;
    const heightStep = 0.28;
    const twistAngle = 0.22;

    const sphereGeometry = new THREE.SphereGeometry(0.16, 16, 16);
    const strandMaterial1 = new THREE.MeshBasicMaterial({ color: 0x00e676 });
    const strandMaterial2 = new THREE.MeshBasicMaterial({ color: 0x00b0ff });
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00e676, transparent: true, opacity: 0.35 });

    for (let i = 0; i < totalNodes; i++) {
      const y = (i - totalNodes / 2) * heightStep;
      const angle = i * twistAngle;

      // Primary Strand Node
      const x1 = Math.cos(angle) * radius;
      const z1 = Math.sin(angle) * radius;
      const node1 = new THREE.Mesh(sphereGeometry, strandMaterial1);
      node1.position.set(x1, y, z1);
      dnaGroup.add(node1);

      // Secondary Opposing Strand Node (180 deg offset)
      const x2 = Math.cos(angle + Math.PI) * radius;
      const z2 = Math.sin(angle + Math.PI) * radius;
      const node2 = new THREE.Mesh(sphereGeometry, strandMaterial2);
      node2.position.set(x2, y, z2);
      dnaGroup.add(node2);

      // Connective Base Rungs (Every 2nd Node)
      if (i % 2 === 0) {
        const points = [
          new THREE.Vector3(x1, y, z1),
          new THREE.Vector3(x2, y, z2)
        ];
        const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const rung = new THREE.Line(lineGeometry, lineMaterial);
        dnaGroup.add(rung);
      }
    }

    // 3. Mouse Interaction Handling
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (event) => {
      const windowHalfX = window.innerWidth / 2;
      const windowHalfY = window.innerHeight / 2;
      targetX = (event.clientX - windowHalfX) * 0.0005;
      targetY = (event.clientY - windowHalfY) * 0.0005;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 4. Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      // Constant axial rotation
      dnaGroup.rotation.y += 0.008;

      // Smooth interpolation towards cursor position (lerp)
      dnaGroup.rotation.y += (targetX - dnaGroup.rotation.y * 0.1) * 0.05;
      dnaGroup.rotation.x += (targetY - dnaGroup.rotation.x * 0.1) * 0.05;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
