<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #010810;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* FULL SCREEN EDGE-TO-EDGE CONTAINER */
    .app-container {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #062a3e 0%, #02111a 60%, #000508 100%);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* BRAND LOGO AREA (CENTERPIECE) */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-auto: auto;
      flex-grow: 1;
      gap: 16px;
    }

    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 210, 255, 0.35);
      animation: spin-ring 8s linear infinite;
    }

    @keyframes spin-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-svg {
      width: 85px;
      height: 85px;
      z-index: 2;
    }

    .brand-title {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      line-height: 1;
      display: flex;
    }

    .brand-title .medi { color: #00d2ff; }
    .brand-title .find { color: #00ffcc; }

    .brand-tagline {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      opacity: 0.9;
      text-transform: uppercase;
    }

    /* EMERGENCY BUTTON SECTION */
    .action-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    .emergency-button {
      width: 100%;
      background: linear-gradient(135deg, #3d0508 0%, #1a0204 100%);
      border: 1.5px solid #ff3344;
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .emergency-button:active {
      transform: scale(0.98);
    }

    .emergency-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .red-icon-box {
      width: 48px;
      height: 48px;
      background: rgba(255, 51, 68, 0.22);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff3344;
      flex-shrink: 0;
    }

    .emergency-text h3 {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 600;
      color: #ff4d5e;
      line-height: 1.1;
    }

    .emergency-text p {
      font-size: 0.8rem;
      color: #ffffff;
      margin-top: 2px;
    }

    .arrow-icon {
      color: #ff4d5e;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="brand-section">
      <div class="logo-wrapper">
        <div class="logo-ring"></div>
        <svg class="logo-svg" viewBox="0 0 100 100">
          <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
          <polygon points="50,38 53,47 62,50 53,53 50,62 47,53 38,50 47,47" fill="#00ffcc"/>
        </svg>
      </div>

      <div class="brand-title">
        <span class="medi">MEDI</span><span class="find">FIND</span>
      </div>

      <div class="brand-tagline">
        Healthcare. Discovered.
      </div>
    </div>

    <div class="action-container">
      <div class="emergency-button">
        <div class="emergency-left">
          <div class="red-icon-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="6" width="15" height="11" rx="2"></rect>
              <path d="M16 8h4l3 3v6h-7V8z"></path>
              <circle cx="5.5" cy="17.5" r="2.5"></circle>
              <circle cx="18.5" cy="17.5" r="2.5"></circle>
              <path d="M8 10h4"></path>
              <path d="M10 8v4"></path>
            </svg>
          </div>
          <div class="emergency-text">
            <h3>Emergency connect</h3>
            <p>One tap ambulance request</p>
          </div>
        </div>
        <div class="arrow-icon">›</div>
      </div>
    </div>

  </div>

</body>
</html>
