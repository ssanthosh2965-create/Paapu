<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #010603;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* LANDING SCREEN */
    #landing-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #010603;
      overflow: hidden;
      z-index: 10;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #010603 88%);
      z-index: 2;
      pointer-events: none;
    }

    .ekg-container {
      position: absolute;
      width: 100%;
      height: 220px;
      top: 36%;
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: none;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
      pointer-events: none;
    }

    .ekg-back-line {
      stroke: rgba(255, 0, 51, 0.25);
      stroke-width: 3.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #ff0033;
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 250 1100;
      stroke-dashoffset: 1350;
      animation: ekgSweep 2.5s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1350; }
      100% { stroke-dashoffset: 0; }
    }

    .logo-wrapper {
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      pointer-events: none;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      margin-bottom: 24px;
    }

    .enter-btn {
      position: relative;
      z-index: 50;
      margin-top: 12px;
      padding: 16px 48px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1.5px solid #7effc3;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
      text-decoration: none;
      display: inline-block;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
    }

    /* LOGIN SCREEN */
    #login-screen {
      display: none;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #010603;
      padding: 20px;
    }

    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(10, 20, 15, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      color: #00ff88;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #010603;
      background: #00ff88;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .submit-btn:hover {
      background: #00cc6a;
    }
  </style>
</head>
<body>

  <section id="landing-screen" class="screen">
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
    
    <div class="ekg-container">
      <svg class="ekg-svg" viewBox="0 0 1000 200" preserveAspectRatio="none">
        <path class="ekg-back-line" d="M0,100 L300,100 L310,80 L320,120 L330,30 L345,170 L360,90 L370,110 L380,100 L1000,100" />
        <path class="ekg-pulse-line" d="M0,100 L300,100 L310,80 L320,120 L330,30 L345,170 L360,90 L370,110 L380,100 L1000,100" />
      </svg>
    </div>

    <div class="logo-wrapper">
      <h1 class="brand-title">MEDIFIND</h1>
    </div>

    <button id="enter-btn" class="enter-btn">Enter System</button>
  </section>

  <section id="login-screen" class="screen">
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>

    <div class="login-card">
      <h2>SYSTEM ACCESS</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Medical ID / Email</label>
          <input type="text" id="email" placeholder="Enter identifier" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn">Authenticate</button>
      </form>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const landingScreen = document.getElementById('landing-screen');
      const loginScreen = document.getElementById('login-screen');
      const enterBtn = document.getElementById('enter-btn');
      const loginForm = document.getElementById('login-form');

      enterBtn.addEventListener('click', () => {
        landingScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Authentication successful!');
      });
    });
  </script>
</body>
</html>
