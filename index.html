<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #0a1727 0%, #030811 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 80px 20px 60px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .logo-wrapper {
      margin-bottom: 24px;
    }

    .logo-svg {
      width: 110px;
      height: 110px;
      color: #00ff88;
      filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.65));
    }

    .brand-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }

    .action-container {
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }

    /* Green Theme Button */
    .enter-btn {
      width: 100%;
      background: linear-gradient(135deg, #00b359 0%, #00ff88 100%);
      color: #030811; /* Dark text for clean contrast */
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.75);
    }

    .enter-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="main-content">
    <div class="logo-wrapper">
      <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Medical Cross Base -->
        <path d="M42 20H58V42H80V58H58V80H42V58H20V42H42V20Z" fill="currentColor"/>
        <!-- Lens Circle -->
        <circle cx="55" cy="55" r="22" stroke="#00ff88" stroke-width="6" fill="#0a1727"/>
        <!-- Handle -->
        <path d="M70 70L86 86" stroke="#00ff88" stroke-width="7" stroke-linecap="round"/>
        <!-- Star Sparkle -->
        <path d="M55 42C55 49 49 55 42 55C49 55 55 61 55 68C55 61 61 55 68 55C61 55 55 49 55 42Z" fill="#00ff88"/>
      </svg>
    </div>
    
    <h1 class="brand-title">MEDIFIND</h1>
  </div>

  <div class="action-container">
    <button class="enter-btn">Enter Platform</button>
  </div>

</body>
</html>
