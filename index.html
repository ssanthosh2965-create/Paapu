  #splash{
    position:fixed; inset:0; z-index:999;
    background:#000b20;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.6s ease, visibility 0.6s ease;

    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;

    to{opacity:1;}
  }

    #splash .splash-mark{animation:none; opacity:1;}
  }
