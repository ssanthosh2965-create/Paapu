<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-color: #010402;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 880px;
      background: radial-gradient(circle at 50% 15%, #052617 0%, #010804 55%, #000000 100%);
      border-radius: 36px;
      border: 1px solid rgba(0, 255, 136, 0.2);
      box-shadow: 0 0 50px rgba(0, 255, 136, 0.15), 0 20px 50px rgba(0, 0, 0, 0.9);
      padding: 28px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* 1. TOP LOGO AREA */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
    }

    .heart-logo {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 0 16px rgba(0, 255, 136, 0.5));
    }

    .brand-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
      display: flex;
    }

    .brand-title .medi {
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }

    .brand-title .find {
      color: #ff3344;
      text-shadow: 0 0 20px rgba(255, 51, 68, 0.5);
    }

    .brand-tagline {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #dddddd;
      margin-top: 6px;
    }

    .brand-tagline span {
      color: #ff3344;
    }

    /* 2. MIDDLE GRAPHIC ILLUSTRATION */
    .hero-stage {
      width: 100%;
      height: 230px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 10px 0;
    }

    /* City Skyline Backdrop */
    .skyline {
      position: absolute;
      bottom: 25px;
      width: 100%;
      height: 110px;
      background: repeating-linear-gradient(
        90deg,
        #06170f 0px,
        #06170f 18px,
        transparent 18px,
        transparent 24px
      );
      border-top: 1px solid rgba(0, 255, 136, 0.2);
      opacity: 0.7;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
    }

    .hero-composition {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
    }

    /* Smartphone Graphic */
    .phone-mockup {
      width: 85px;
      height: 155px;
      background: #040d08;
      border: 2px solid #00ff88;
      border-radius: 16px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      transform: rotate(-6deg) translateY(-8px);
      flex-shrink: 0;
    }

    .phone-mockup .pin-icon {
      color: #ff3344;
      filter: drop-shadow(0 0 8px #ff3344);
    }

    .phone-mockup p {
      font-size: 0.58rem;
      font-weight: 700;
      color: #e0f2fe;
      text-align: center;
      line-height: 1.1;
      margin-top: 6px;
    }

    .phone-mockup .mini-ambulance {
      margin-top: 8px;
      padding: 3px 6px;
      background: rgba(255, 51, 68, 0.15);
      border-radius: 6px;
      border: 0.5px solid #ff3344;
    }

    /* Ambulance Graphic */
    .a_clean_modern_medical_app_landing_page_style_ill {
      width: 175px;
      height: 120px;
      background: linear-gradient(145deg, #18221c 0%, #0c120e 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 25px rgba(255, 51, 68, 0.3);
    }

    .beacon-light {
      position: absolute;
      top: 10px;
      width: 16px;
      height: 6px;
      background: #ff3344;
      border-radius: 3px;
      box-shadow: 0 0 15px #ff3344, 0 0 25px #ff3344;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* Shield Graphic */
    .shield-mockup {
      width: 75px;
      height: 90px;
      background: linear-gradient(145deg, #0a2d1d 0%, #03140c 100%);
      border: 2px solid #00ff88;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
      transform: rotate(6deg) translateY(-12px);
      flex-shrink: 0;
    }

    /* 3. BUTTONS SECTION */
    .action-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .emergency-button {
      width: 100%;
      background: linear-gradient(135deg, #3d0508 0%, #1a0204 100%);
      border: 1.5px solid #ff3344;
      border-radius: 28px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 4px 25px rgba(255, 51, 68, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .emergency-button:active {
      transform: scale(0.98);
    }

    .emergency-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .red-icon-box {
      width: 46px;
      height: 46px;
      background: rgba(255, 51, 68, 0.22);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff3344;
      flex-shrink: 0;
    }

    .emergency-text h3 {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ff4d5e;
      line-height: 1.1;
    }

    .emergency-text p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 2px;
    }

    .arrow-icon {
      color: #ff4d5e;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .enter-system-btn {
      width: 100%;
      padding: 16px;
      font-family: 'Newsreader', serif;
      font-size: 1.45rem;
      font-style: italic;
      font-weight: 700;
      color: #000000;
      background: linear-gradient(180deg, #00ff88 0%, #00cc6a 100%);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .enter-system-btn:active {
      transform: scale(0.98);
    }

    /* 4. FEATURE BADGES GRID */
    .features-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .feature-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .feature-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #04140b;
      border: 1px solid rgba(0, 255, 136, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .feature-card span {
      font-size: 0.72rem;
      font-weight: 600;
      color: #e2ece6;
      line-height: 1.2;
    }

    /* 5. FOOTER */
    .footer-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #00ff88;
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- BRAND LOGO & TITLE -->
    <div class="brand-section">
      <svg class="heart-logo" viewBox="0 0 100 100" fill="none">
        <path d="M50 86C50 86 16 60 16 34 C16 20 28 10 41 10 C49 10 50 16 50 16 C50 16 51 10 59 10 C72 10 84 20 84 34 C84 60 50 86 50 86Z" stroke="#00ff88" stroke-width="6" fill="none"/>
        <path d="M26 42 H40 L44 30 L50 54 L56 38 L60 42 H74" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M72 16 V28 M66 22 H78" stroke="#ff3344" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="brand-title">
        <span class="medi">MEDI</span><span class="find">FIND</span>
      </div>
      <div class="brand-tagline">
        FIND CARE. SAVE TIME. <span>SAVE LIVES.</span>
      </div>
    </div>

    <!-- MIDDLE ILLUSTRATION -->
    <div class="hero-stage">
      <div class="skyline"></div>
      <div class="hero-composition">
        
        <!-- Phone Graphic -->
        <div class="phone-mockup">
          <svg class="pin-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <p>Nearest Ambulance On the Way</p>
          <div class="mini-ambulance">
            <svg width="20" height="12" viewBox="0 0 24 24" fill="none" stroke="#ff3344" stroke-width="2">
              <rect x="1" y="6" width="15" height="11" rx="2"></rect>
              <path d="M16 8h4l3 3v6h-7V8z"></path>
            </svg>
          </div>
        </div>

        <!-- Ambulance Graphic -->
        <div class="ambulance-center">
          <div class="beacon-light"></div>
          <svg width="70" height="45" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8">
            <rect x="1" y="6" width="15" height="11" rx="2"></rect>
            <path d="M16 8h4l3 3v6h-7V8z"></path>
            <circle cx="5.5" cy="17.5" r="2.5" fill="#ff3344"></circle>
            <circle cx="18.5" cy="17.5" r="2.5" fill="#ff3344"></circle>
            <path d="M8 10h4" stroke="#ff3344" stroke-width="2"></path>
            <path d="M10 8v4" stroke="#ff3344" stroke-width="2"></path>
          </svg>
        </div>

        <!-- Shield Graphic -->
        <div class="shield-mockup">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="M12 8v8M8 12h8" stroke="#00ff88" stroke-width="2"/>
          </svg>
        </div>

      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-group">
      <div class="emergency-button">
        <div class="emergency-left">
          <div class="red-icon-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="6" width="15" height="11" rx="2"></rect>
              <path d="M16 8h4l3 3v6h-7V8z"></path>
              <circle cx="5.5" cy="17.5" r="2.5"></circle>
              <circle cx="18.5" cy="17.5" r="2.5"></circle>
              <path d="M8 10h4"></path>
              <path d="M10 8v4"></path>
            </svg>
          </div>
          <div class="emergency-text">
            <h3>Emergency connect</h3>
            <p>One tap ambulance request</p>
          </div>
        </div>
        <div class="arrow-icon">›</div>
      </div>

      <button class="enter-system-btn">Enter System</button>
    </div>

    <!-- FEATURE BADGES -->
    <div class="features-row">
      <div class="feature-card">
        <div class="feature-icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <span>Nearby Hospitals</span>
      </div>

      <div class="feature-card">
        <div class="feature-icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span>Doctor Availability</span>
      </div>

      <div class="feature-card">
        <div class="feature-icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
        </div>
        <span>Health Records</span>
      </div>

      <div class="feature-card">
        <div class="feature-icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="M12 8v8M8 12h8"></path>
          </svg>
        </div>
        <span>Secure & Trusted</span>
      </div>
    </div>

    <!-- FOOTER TAGLINE -->
    <div class="footer-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>Your Health. Our Priority.</span>
    </div>

  </div>

</body>
</html>
