<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND - Ultra Sharp Logo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@1,6..72,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #010603;
      overflow: hidden;
      position: relative;
    }

    /* Crisp Grid Background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #010603 88%);
      z-index: 2;
    }

    /* Circle Framing Ring */
    .circle-ring {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 255, 136, 0.4);
      z-index: 3;
    }

    /* EKG Pulse Wave */
    .ekg-container {
      position: absolute;
      width: 100%;
      height: 120px;
      top: 38%;
      transform: translateY(-50%);
      z-index: 4;
      pointer-events: none;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
    }

    .ekg-back-line {
      stroke: rgba(0, 255, 136, 0.25);
      stroke-width: 1.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #00ff88;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 200 1000;
      stroke-dashoffset: 1200;
      animation: ekgSweep 2.8s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }

    /* Container */
    .logo-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    .vector-logo {
      width: 100%;
      height: auto;
      shape-rendering: geometricPrecision;
    }

    /* Sharp Button */
    .enter-btn {
      margin-top: 10px;
      padding: 14px 44px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1.5px solid #7effc3;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
      transition: transform 0.2s ease;
    }

    .enter-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="circle-ring"></div>

  <!-- Animated EKG Pulse Line -->
  <div class="ekg-container">
    <svg class="ekg-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path class="ekg-back-line" d="M 0,60 H 350 L 360,50 L 370,60 H 390 L 400,20 L 415,100 L 430,10 L 445,75 L 455,60 H 480 L 490,45 L 500,60 H 700 L 710,50 L 720,60 H 740 L 750,20 L 765,100 L 780,10 L 795,75 L 805,60 H 830 L 840,45 L 850,60 H 1200" />
      <path class="ekg-pulse-line" d="M 0,60 H 350 L 360,50 L 370,60 H 390 L 400,20 L 415,100 L 430,10 L 445,75 L 455,60 H 480 L 490,45 L 500,60 H 700 L 710,50 L 720,60 H 740 L 750,20 L 765,100 L 780,10 L 795,75 L 805,60 H 830 L 840,45 L 850,60 H 1200" />
    </svg>
  </div>

  <!-- Pure Vector SVG Logo (Icon + Text) -->
  <div class="logo-wrapper">
    <svg class="vector-logo" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00ff88" />
          <stop offset="100%" stop-color="#00cc6a" />
        </linearGradient>

        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#006635" />
          <stop offset="100%" stop-color="#00331b" />
        </linearGradient>

        <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00ff88" />
          <stop offset="100%" stop-color="#00d672" />
        </linearGradient>
      </defs>

      <!-- 3D EXTRUSION BACKING FACETS (CROSS) -->
      <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#sideGrad)" transform="translate(10, 14)" />

      <!-- FRONT FACE (CROSS) -->
      <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#frontGrad)" rx="3" />

      <!-- MAGNIFYING GLASS HOUSING -->
      <!-- Outer Ring Depth -->
      <circle cx="200" cy="125" r="42" fill="#010603" stroke="url(#sideGrad)" stroke-width="8" transform="translate(4, 5)" />
      <!-- Outer Ring Front Face -->
      <circle cx="200" cy="125" r="42" fill="#010e07" stroke="#00ff88" stroke-width="7" />
      
      <!-- Handle Depth -->
      <path d="M 230 155 L 265 190" stroke="#00331b" stroke-width="16" stroke-linecap="round" transform="translate(5, 7)" />
      <!-- Handle Front Face -->
      <path d="M 230 155 L 265 190" stroke="#00ff88" stroke-width="14" stroke-linecap="round" />

      <!-- SPARKLE STAR (LENS CENTER) -->
      <path d="M 200 97 Q 200 125 228 125 Q 200 125 200 153 Q 200 125 172 125 Q 200 125 200 97 Z" fill="#ffffff" />

      <!-- VECTOR 3D TEXT "MEDIFIND" -->
      <!-- 3D Extrusion Shadow Layers -->
      <text x="200" y="280" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="44" letter-spacing="3" fill="#00331b" transform="translate(5, 5)">MEDIFIND</text>
      <text x="200" y="280" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="44" letter-spacing="3" fill="#006635" transform="translate(3, 3)">MEDIFIND</text>
      <text x="200" y="280" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="44" letter-spacing="3" fill="#00994f" transform="translate(1, 1)">MEDIFIND</text>

      <!-- Front Text Face -->
      <text x="200" y="280" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="44" letter-spacing="3" fill="url(#textGrad)">MEDIFIND</text>
    </svg>

    <button class="enter-btn">Enter Platform</button>
  </div>

</body>
</html>
