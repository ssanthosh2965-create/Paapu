<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIFIND - Professional Medical Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060b13;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    /* 3D WebGL Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Interface Overlay */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at center, rgba(6, 11, 19, 0.2) 0%, rgba(6, 11, 19, 0.85) 100%);
    }

    /* Logo Styling */
    .logo-box {
      width: 110px;
      height: 110px;
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 25px rgba(0, 230, 118, 0.75));
    }

    .logo-box svg {
      width: 100%;
      height: 100%;
    }

    /* App Title */
    .title {
      color: #00e676;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 44px;
      font-style: italic;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      text-shadow: 0 0 25px rgba(0, 230, 118, 0.7);
    }

    /* Enter Button */
    .btn-enter {
      background: #00e676;
      color: #060b13;
      border: none;
      padding: 18px 48px;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 230, 118, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn-enter:hover {
      transform: scale(1.05);
      background: #00ff87;
      box-shadow: 0 0 45px rgba(0, 230, 118, 0.9);
    }
  </style>
</head>
<body>

  <!-- Three.js Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Content Layer -->
  <div class="container">
    <div class="logo-box">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 40 10 H 60 V 30 H 80 V 50 H 60 V 70 H 40 V 50 H 20 V 30 H 40 Z" fill="#00e676" />
        <circle cx="50" cy="40" r="16" fill="#060b13" />
        <circle cx="50" cy="40" r="13" fill="none" stroke="#00e676" stroke-width="3" />
        <path d="M 50 30 Q 50 40 60 40 Q 50 40 50 50 Q 50 40 40 40 Q 50 40 50 30 Z" fill="#00e676" />
        <rect x="61" y="53" width="9" height="24" rx="4.5" transform="rotate(-45 61 53)" fill="#00e676" />
      </svg>
    </div>

    <h1 class="title">MEDIFIND</h1>

    <button class="btn-enter">Enter Platform</button>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 65);

    // --- 1. Medical Grid Plane ---
    const gridHelper = new THREE.GridHelper(160, 40, 0x00e676, 0x092b20);
    gridHelper.rotation.x = Math.PI / 2.8;
    gridHelper.position.set(0, -12, -10);
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.35;
    scene.add(gridHelper);

    // --- 2. Primary 3D Heartbeat (ECG) Wave Line ---
    const ecgSegments = 600;
    const ecgPositions = new Float32Array(ecgSegments * 3);
    const ecgGeometry = new THREE.BufferGeometry();
    ecgGeometry.setAttribute('position', new THREE.BufferAttribute(ecgPositions, 3));

    const ecgMaterial = new THREE.LineBasicMaterial({
      color: 0x00e676,
      linewidth: 4,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });

    const ecgLine = new THREE.Line(ecgGeometry, ecgMaterial);
    ecgLine.position.set(0, 0, 5);
    scene.add(ecgLine);

    // --- 3. Secondary Shadow ECG Echo Line ---
    const echoPositions = new Float32Array(ecgSegments * 3);
    const echoGeometry = new THREE.BufferGeometry();
    echoGeometry.setAttribute('position', new THREE.BufferAttribute(echoPositions, 3));

    const echoMaterial = new THREE.LineBasicMaterial({
      color: 0x00b0ff,
      linewidth: 2,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending
    });

    const echoLine = new THREE.Line(echoGeometry, echoMaterial);
    echoLine.position.set(0, -2, -8);
    scene.add(echoLine);

    // --- 4. Glowing Pulse Tracer Spheres ---
    const tracerGeo = new THREE.SphereGeometry(1.5, 16, 16);
    const tracerMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending
    });
    const tracerDot = new THREE.Mesh(tracerGeo, tracerMat);
    scene.add(tracerDot);

    // Point light that follows the pulse peak
    const pulseLight = new THREE.PointLight(0x00e676, 3, 40);
    scene.add(pulseLight);

    // --- 5. Floating Medical Data Particles ---
    const particleCount = 200;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 140;
      particlePositions[i + 1] = (Math.random() - 0.5) * 80;
      particlePositions[i + 2] = (Math.random() - 0.5) * 60;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0x00e676,
      size: 0.8,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- 6. Mathematical ECG Pulse Formula ---
    function getEcgY(phase) {
      const p = ((phase % 40) + 40) % 40;
      if (p > 12 && p <= 14) return Math.sin((p - 12) / 2 * Math.PI) * 2.2;     // P wave
      if (p > 15 && p <= 16) return -2.8;                                        // Q wave
      if (p > 16 && p <= 18) return (p - 16) == 1 ? 17.5 : -5.5;                // R Spike
      if (p > 18 && p <= 20) return -4.5 + (p - 18) * 2.25;                     // S wave
      if (p > 22 && p <= 26) return Math.sin((p - 22) / 4 * Math.PI) * 4.2;     // T wave
      return 0;
    }

    // --- 7. Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      const ecgAttr = ecgGeometry.attributes.position;
      const echoAttr = echoGeometry.attributes.position;
      const speed = elapsed * 32;
      const totalWidth = 130;

      let leadX = 0, leadY = 0, leadZ = 0;
      const tracerIndex = Math.floor(ecgSegments * 0.78);

      for (let i = 0; i < ecgSegments; i++) {
        const x = (i / ecgSegments) * totalWidth - totalWidth / 2;
        const phase = x + speed;
        const y = getEcgY(phase);
        
        // Dynamic 3D depth movement along Z-axis
        const z = Math.sin(x * 0.05 + elapsed * 1.8) * 5;

        // Primary Line
        ecgAttr.array[i * 3] = x;
        ecgAttr.array[i * 3 + 1] = y;
        ecgAttr.array[i * 3 + 2] = z;

        // Echo Line (slightly offset)
        echoAttr.array[i * 3] = x;
        echoAttr.array[i * 3 + 1] = getEcgY(phase - 6) * 0.6;
        echoAttr.array[i * 3 + 2] = z - 8;

        if (i === tracerIndex) {
          leadX = x;
          leadY = y;
          leadZ = z + 5;
        }
      }

      ecgAttr.needsUpdate = true;
      echoAttr.needsUpdate = true;

      // Update Pulse Tracer Dot & Dynamic Light
      tracerDot.position.set(leadX, leadY, leadZ);
      pulseLight.position.set(leadX, leadY, leadZ + 5);

      // Slow drift for particle field
      const pArr = particleGeo.attributes.position.array;
      for (let i = 1; i < particleCount * 3; i += 3) {
        pArr[i] += 0.05;
        if (pArr[i] > 40) pArr[i] = -40;
      }
      particleGeo.attributes.position.needsUpdate = true;

      // Subtle camera rotation for 3D depth
      camera.position.x = Math.sin(elapsed * 0.3) * 3;
      camera.position.y = Math.cos(elapsed * 0.2) * 2;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
