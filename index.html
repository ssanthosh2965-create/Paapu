<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #010810;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #062a3e 0%, #02111a 60%, #000508 100%);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    /* CENTER LOGO AREA */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: auto;
      flex-grow: 1;
      gap: 18px;
      z-index: 2;
    }

    /* LOGO ASSEMBLY CONTAINER */
    .logo-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* PULSING BACKGROUND GLOW AFTER ASSEMBLY */
    .logo-glow {
      position: absolute;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.4) 0%, rgba(0, 210, 255, 0.2) 50%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      animation: glowPulse 0.6s ease-out 1.2s forwards;
    }

    @keyframes glowPulse {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    /* SVG LOGO PIECES BASE CLASS */
    .logo-piece {
      position: absolute;
      width: 100%;
      height: 100%;
      will-change: transform, opacity;
      animation-duration: 1.2s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      animation-fill-mode: forwards;
    }

    /* 1. TOP-LEFT PIECE: Fly in from top-left, rotate 360deg, assemble */
    .piece-tl {
      opacity: 0;
      animation-name: flyTopLeft;
    }

    @keyframes flyTopLeft {
      0% {
        opacity: 0;
        transform: translate(-300px, -300px) rotate(-360deg) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    /* 2. TOP-RIGHT PIECE: Fly in from top-right, rotate -360deg, assemble */
    .piece-tr {
      opacity: 0;
      animation-name: flyTopRight;
    }

    @keyframes flyTopRight {
      0% {
        opacity: 0;
        transform: translate(300px, -300px) rotate(360deg) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    /* 3. BOTTOM-LEFT PIECE: Fly in from bottom-left, rotate 360deg, assemble */
    .piece-bl {
      opacity: 0;
      animation-name: flyBottomLeft;
    }

    @keyframes flyBottomLeft {
      0% {
        opacity: 0;
        transform: translate(-300px, 300px) rotate(360deg) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    /* 4. BOTTOM-RIGHT PIECE: Fly in from bottom-right, rotate -360deg, assemble */
    .piece-br {
      opacity: 0;
      animation-name: flyBottomRight;
    }

    @keyframes flyBottomRight {
      0% {
        opacity: 0;
        transform: translate(300px, 300px) rotate(-360deg) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    /* ROTATING DASHED TECH RING (Appears after pieces join) */
    .logo-ring {
      position: absolute;
      width: 115%;
      height: 115%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 210, 255, 0.5);
      opacity: 0;
      animation: ringFadeIn 0.5s ease-out 1.2s forwards, spinRing 8s linear 1.2s infinite;
    }

    @keyframes ringFadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* TEXT ENTRANCE (Reveals right after logo merges) */
    .text-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: textReveal 0.8s ease-out 1.1s forwards;
    }

    @keyframes textReveal {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-title {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      line-height: 1;
      display: flex;
    }

    .brand-title .medi { color: #00d2ff; }
    .brand-title .find { color: #00ffcc; }

    .brand-tagline {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      opacity: 0.9;
      text-transform: uppercase;
    }

    /* EMERGENCY BUTTON REVEAL */
    .action-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
      z-index: 2;
      opacity: 0;
      animation: buttonSlideUp 0.8s ease-out 1.3s forwards;
    }

    @keyframes buttonSlideUp {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .emergency-button {
      width: 100%;
      background: linear-gradient(135deg, #3d0508 0%, #1a0204 100%);
      border: 1.5px solid #ff3344;
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .emergency-button:active {
      transform: scale(0.98);
    }

    .emergency-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .red-icon-box {
      width: 48px;
      height: 48px;
      background: rgba(255, 51, 68, 0.22);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff3344;
      flex-shrink: 0;
    }

    .emergency-text h3 {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 600;
      color: #ff4d5e;
      line-height: 1.1;
    }

    .emergency-text p {
      font-size: 0.8rem;
      color: #ffffff;
      margin-top: 2px;
    }

    .arrow-icon {
      color: #ff4d5e;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="brand-section">
      
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-ring"></div>

        <svg class="logo-piece piece-tl" viewBox="0 0 100 100">
          <g clip-path="url(#clip-tl)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
            <polygon points="50,38 53,47 62,50 53,53 50,62 47,53 38,50 47,47" fill="#00ffcc"/>
          </g>
          <defs>
            <clipPath id="clip-tl">
              <rect x="0" y="0" width="50" height="50" />
            </clipPath>
          </defs>
        </svg>

        <svg class="logo-piece piece-tr" viewBox="0 0 100 100">
          <g clip-path="url(#clip-tr)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
            <polygon points="50,38 53,47 62,50 53,53 50,62 47,53 38,50 47,47" fill="#00ffcc"/>
          </g>
          <defs>
            <clipPath id="clip-tr">
              <rect x="50" y="0" width="50" height="50" />
            </clipPath>
          </defs>
        </svg>

        <svg class="logo-piece piece-bl" viewBox="0 0 100 100">
          <g clip-path="url(#clip-bl)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
            <polygon points="50,38 53,47 62,50 53,53 50,62 47,53 38,50 47,47" fill="#00ffcc"/>
          </g>
          <defs>
            <clipPath id="clip-bl">
              <rect x="0" y="50" width="50" height="50" />
            </clipPath>
          </defs>
        </svg>

        <svg class="logo-piece piece-br" viewBox="0 0 100 100">
          <g clip-path="url(#clip-br)">
            <path d="M 38 16 H 62 V 38 H 84 V 62 H 62 V 84 H 38 V 62 H 16 V 38 H 38 Z" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="22" fill="none" stroke="#00ffcc" stroke-width="5"/>
            <polygon points="50,38 53,47 62,50 53,53 50,62 47,53 38,50 47,47" fill="#00ffcc"/>
          </g>
          <defs>
            <clipPath id="clip-br">
              <rect x="50" y="50" width="50" height="50" />
            </clipPath>
          </defs>
        </svg>

      </div>

      <div class="text-container">
        <div class="brand-title">
          <span class="medi">MEDI</span><span class="find">FIND</span>
        </div>

        <div class="brand-tagline">
          Healthcare. Discovered.
        </div>
      </div>

    </div>

    <div class="action-container">
      <div class="emergency-button">
        <div class="emergency-left">
          <div class="red-icon-box">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="6" width="15" height="11" rx="2"></rect>
              <path d="M16 8h4l3 3v6h-7V8z"></path>
              <circle cx="5.5" cy="17.5" r="2.5"></circle>
              <circle cx="18.5" cy="17.5" r="2.5"></circle>
              <path d="M8 10h4"></path>
              <path d="M10 8v4"></path>
            </svg>
          </div>
          <div class="emergency-text">
            <h3>Emergency connect</h3>
            <p>One tap ambulance request</p>
          </div>
        </div>
        <div class="arrow-icon">›</div>
      </div>
    </div>

  </div>

</body>
</html>
