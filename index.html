<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #010603;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* LANDING SCREEN (UNTOUCHED) */
    #landing-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #010603;
      overflow: hidden;
      z-index: 10;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none !important;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #010603 88%);
      z-index: 2;
      pointer-events: none !important;
    }

    .ekg-container {
      position: absolute;
      width: 100%;
      height: 220px;
      top: 36%;
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: none !important;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
      pointer-events: none !important;
    }

    .ekg-back-line {
      stroke: rgba(255, 0, 51, 0.25);
      stroke-width: 3.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #ff0033;
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 250 1100;
      stroke-dashoffset: 1350;
      animation: ekgSweep 2.5s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1350; }
      100% { stroke-dashoffset: 0; }
    }

    .logo-wrapper {
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      pointer-events: none;
    }

    .vector-logo {
      width: 100%;
      height: auto;
      shape-rendering: geometricPrecision;
      pointer-events: none !important;
    }

    .enter-btn {
      position: relative;
      z-index: 999999 !important;
      margin-top: 12px;
      padding: 16px 48px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1.5px solid #7effc3;
      border-radius: 40px;
      cursor: pointer !important;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
      text-decoration: none;
      display: inline-block;
      text-align: center;
      pointer-events: auto !important;
      user-select: none;
      touch-action: manipulation;
    }

      align-items: center;
      position: relative;
