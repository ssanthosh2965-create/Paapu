<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIFIND</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #06090e;
      color: #ffffff;
    }

    /* Interactive Background Canvas */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Foreground Content */
    .hero-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    /* Logo Styling */
    .logo-wrapper {
      width: 90px;
      height: 90px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 15px rgba(0, 230, 118, 0.4));
      animation: float 4s ease-in-out infinite;
    }

    .logo-wrapper svg {
      width: 100%;
      height: 100%;
      fill: #00e676;
    }

    /* Brand Text */
    .title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #00e676;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
      margin-bottom: 40px;
      font-family: 'Georgia', serif;
    }

    /* Button Styling */
    .enter-btn {
      background: #00e676;
      color: #06090e;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 48px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 230, 118, 0.5);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: #33eb91;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.8);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Background Interactive Layer -->
  <canvas id="bg-canvas"></canvas>

  <!-- Content Layer -->
  <main class="hero-container">
    <div class="logo-wrapper">
      <svg viewBox="0 0 100 100">
        <!-- Target / Crosshair Magnifier Medical Logo -->
        <path d="M 45 10 H 55 V 35 H 80 V 45 H 55 V 55 H 80 V 65 H 55 V 90 H 45 V 65 H 20 V 55 H 45 V 45 H 20 V 35 H 45 Z" />
        <circle cx="50" cy="50" r="30" fill="none" stroke="#00e676" stroke-width="8" />
        <line x1="70" y1="70" x2="90" y2="90" stroke="#00e676" stroke-width="10" stroke-linecap="round" />
        <path d="M 50 42 L 53 47 L 58 50 L 53 53 L 50 58 L 47 53 L 42 50 L 47 47 Z" fill="#06090e" />
      </svg>
    </div>

    <h1 class="title">MEDIFIND</h1>

    <button class="enter-btn">Enter Platform</button>
  </main>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let mouse = { x: null, y: null, radius: 150 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });

    resize();

    class MedicalParticle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 4 + 2;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.isCross = Math.random() > 0.7; // 30% are medical crosses
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        // Interactive mouse push
        if (mouse.x && mouse.y) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < mouse.radius) {
            let angle = Math.atan2(dy, dx);
            let force = (mouse.radius - distance) / mouse.radius;
            this.x -= Math.cos(angle) * force * 3;
            this.y -= Math.sin(angle) * force * 3;
          }
        }
      }

      draw() {
        ctx.fillStyle = 'rgba(0, 230, 118, 0.4)';
        if (this.isCross) {
          // Draw mini medical cross
          const s = this.size * 1.5;
          ctx.fillRect(this.x - s / 2, this.y - s / 6, s, s / 3);
          ctx.fillRect(this.x - s / 6, this.y - s / 2, s / 3, s);
        } else {
          // Draw floating node dot
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    for (let i = 0; i < 60; i++) {
      particles.push(new MedicalParticle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Connect nearby particles with glowing lines
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            ctx.strokeStyle = `rgba(0, 230, 118, ${1 - dist / 120 * 0.8})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
