<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #030811; /* Completely flat dark background */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    /* Main Centered Container */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 320px;
      transform: translateY(-30px);
    }

    /* Logo Area Container */
    .logo-area {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Sharp Flat Plus Symbol */
    .plus-symbol {
      position: absolute;
      width: 110px;
      height: 110px;
      color: #00ff88;
      opacity: 0;
      animation: revealPlus 0.8s ease-out 0.2s forwards;
    }

    @keyframes revealPlus {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Sharp Flat Magnifying Glass Symbol */
    .search-symbol-standalone {
      position: absolute;
      width: 110px;
      height: 110px;
      color: #00ff88;
      opacity: 0;
      animation: searchAndDock 2s cubic-bezier(0.34, 1.3, 0.64, 1) 0.8s forwards;
    }

    @keyframes searchAndDock {
      0% {
        opacity: 0;
        transform: translate(-140px, -90px) scale(1.4) rotate(-25deg);
      }
      35% {
        opacity: 1;
        transform: translate(-30px, -40px) scale(1.2) rotate(-10deg);
      }
      65% {
        opacity: 1;
        transform: translate(25px, -10px) scale(1.1) rotate(10deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    /* Sharp Flat Title */
    .brand-title {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00ff88;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: revealElement 0.8s ease-out 2.9s forwards;
    }

    /* Sharp Solid Button */
    .enter-btn {
      width: 100%;
      background-color: #00ff88;
      color: #030811;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(25px);
      animation: revealElement 0.8s ease-out 3.3s forwards;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .enter-btn:hover {
      background-color: #00e67a;
      transform: translateY(-2px) !important;
    }

    .enter-btn:active {
      transform: translateY(0) !important;
    }

    @keyframes revealElement {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-area">
      <!-- Crisp Medical Plus Symbol -->
      <svg class="plus-symbol" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M41 15H59V41H85V59H59V85H41V59H15V41H41V15Z" fill="currentColor"/>
      </svg>

      <!-- Crisp Magnifying Glass Symbol -->
      <svg class="search-symbol-standalone" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="53" cy="53" r="22" stroke="#00ff88" stroke-width="5" fill="#030811"/>
        <path d="M69 69L87 87" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
        <path d="M53 39C53 46 47 53 40 53C47 53 53 60 53 67C53 60 60 53 67 53C60 53 53 46 53 39Z" fill="#00ff88"/>
      </svg>
    </div>
    
    <h1 class="brand-title">MEDIFIND</h1>

    <button class="enter-btn">Enter Platform</button>
  </div>

</body>
</html>
