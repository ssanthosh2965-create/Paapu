<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIFIND</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #010603;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* Page View Containers */
    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    /* =========================================================
       SCREEN 1: LANDING PAGE
       ========================================================= */
    #landing-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #010603;
      overflow: hidden;
      z-index: 10;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #010603 88%);
      z-index: 2;
      pointer-events: none;
    }

    .ekg-container {
      position: absolute;
      width: 100%;
      height: 220px;
      top: 36%;
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: none;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
    }

    .ekg-back-line {
      stroke: rgba(255, 0, 51, 0.25);
      stroke-width: 3.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #ff0033;
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 250 1100;
      stroke-dashoffset: 1350;
      animation: ekgSweep 2.5s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1350; }
      100% { stroke-dashoffset: 0; }
    }

    .logo-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    .vector-logo {
      width: 100%;
      height: auto;
      shape-rendering: geometricPrecision;
      pointer-events: none;
    }

    .enter-btn {
      position: relative;
      z-index: 20;
      margin-top: 12px;
      padding: 14px 44px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1.5px solid #7effc3;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      pointer-events: auto;
    }

    .enter-btn:hover {
      box-shadow: 0 6px 20px rgba(0, 255, 136, 0.6);
      transform: translateY(-2px);
    }

    .enter-btn:active {
      transform: scale(0.96);
    }

    /* =========================================================
       SCREEN 2: PLATFORM SCREEN (DESIGN FROM IMAGE 1)
       ========================================================= */
    #platform-screen {
      display: none;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at 85% 35%, #5eead4 0%, #14b8a6 25%, #0d9488 45%, #0f766e 70%, #042f2e 100%);
      background-attachment: fixed;
      padding: 36px 24px;
      opacity: 0;
      transform: translateY(15px);
      overflow-x: hidden;
    }

    /* Ambient Background Effects */
    .graphic-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Curved Light Swoosh Top Right */
    .top-wave {
      position: absolute;
      top: -50px;
      right: -50px;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(94, 234, 212, 0.2) 50%, transparent 70%);
      filter: blur(20px);
    }

    /* Bottom Light Waves */
    .bottom-wave {
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 480px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(45, 212, 191, 0.5) 0%, rgba(20, 184, 166, 0.2) 60%, transparent 80%);
      filter: blur(25px);
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      position: relative;
      z-index: 10;
    }

    /* HEADER: MediFind Logo + EKG Line */
    .brand-header-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    .brand-icon-box {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #0d9488 0%, #044e46 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(4, 47, 46, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .brand-title-text {
      font-family: 'Newsreader', serif;
      font-size: 2.35rem;
      font-weight: 700;
      color: #032b26;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .header-ekg-svg {
      flex-grow: 1;
      height: 36px;
      margin-left: 2px;
      overflow: visible;
    }

    /* STEPPER CONTAINER */
    .stepper {
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
    }

    /* Continuous Line behind icons */
    .stepper-line {
      position: absolute;
      top: 26px;
      bottom: 26px;
      left: 25px;
      width: 2.5px;
      background: linear-gradient(to bottom, #0f766e 0%, #5eead4 50%, #0f766e 100%);
      z-index: 1;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    /* STEP ICONS */
    .step-icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 2px solid #0d9488;
      color: #0d9488;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }

    /* Active Icon Style (Glowing Stethoscope) */
    .step-item.active .step-icon-wrapper {
      background: linear-gradient(135deg, #0d9488 0%, #044e46 100%);
      border: 2.5px solid #5eead4;
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.5), 0 8px 18px rgba(13, 148, 136, 0.5);
    }

    /* STEP CAPSULES (Frosted Glass Pills) */
    .step-capsule {
      flex-grow: 1;
      max-width: 280px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.55) 0%, rgba(240, 253, 250, 0.35) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 35px;
      padding: 12px 24px;
      box-shadow: 0 4px 15px rgba(4, 47, 46, 0.06);
    }

    .step-item.active .step-capsule {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.75) 0%, rgba(204, 251, 241, 0.55) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 20px rgba(4, 47, 46, 0.1);
    }

    .step-label-text {
      font-family: 'Newsreader', serif;
      font-size: 1.35rem;
      font-style: italic;
      font-weight: 600;
      color: #043832;
      line-height: 1.1;
    }

    /* RIGHT SIDE GLOWING MEDICAL CROSS TARGET */
    .medical-target-graphic {
      position: absolute;
      right: -30px;
      top: 42%;
      width: 220px;
      height: 220px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.85;
    }

    /* BOTTOM MEDICAL ARTWORK AREA */
    .bottom-decor-container {
      margin-top: 10px;
      position: relative;
      width: 100%;
      height: 180px;
      pointer-events: none;
      z-index: 4;
    }

    /* SVG Artwork for Bottom Stethoscope & Cubes */
    .bottom-decor-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Screen Transition Animation Classes */
    .fade-out {
      opacity: 0;
      transform: scale(0.97);
    }

    .fade-in {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
  </style>
</head>
<body>

  <!-- PAGE 1: LANDING LOGO SCREEN -->
  <div id="landing-screen" class="screen">
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>

    <div class="ekg-container">
      <svg class="ekg-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
        <path class="ekg-back-line" d="M 0,100 H 300 L 315,85 L 330,100 H 360 L 375,25 L 395,185 L 415,10 L 435,145 L 450,100 H 490 L 505,75 L 520,100 H 680 L 695,85 L 710,100 H 740 L 755,25 L 775,185 L 795,10 L 815,145 L 830,100 H 870 L 885,75 L 900,100 H 1200" />
        <path class="ekg-pulse-line" d="M 0,100 H 300 L 315,85 L 330,100 H 360 L 375,25 L 395,185 L 415,10 L 435,145 L 450,100 H 490 L 505,75 L 520,100 H 680 L 695,85 L 710,100 H 740 L 755,25 L 775,185 L 795,10 L 815,145 L 830,100 H 870 L 885,75 L 900,100 H 1200" />
      </svg>
    </div>

    <div class="logo-wrapper">
      <svg class="vector-logo" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" />
            <stop offset="100%" stop-color="#00cc6a" />
          </linearGradient>

          <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#006635" />
            <stop offset="100%" stop-color="#00331b" />
          </linearGradient>

          <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" />
            <stop offset="100%" stop-color="#00d672" />
          </linearGradient>
        </defs>

        <g transform="translate(48, 25) scale(0.76)">
          <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#sideGrad)" transform="translate(10, 14)" />
          <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#frontGrad)" rx="3" />

          <circle cx="200" cy="125" r="42" fill="#010603" stroke="url(#sideGrad)" stroke-width="8" transform="translate(4, 5)" />
          <circle cx="200" cy="125" r="42" fill="#010e07" stroke="#00ff88" stroke-width="7" />
          
          <path d="M 230 155 L 265 190" stroke="#00331b" stroke-width="16" stroke-linecap="round" transform="translate(5, 7)" />
          <path d="M 230 155 L 265 190" stroke="#00ff88" stroke-width="14" stroke-linecap="round" />

          <path d="M 200 97 Q 200 125 228 125 Q 200 125 200 153 Q 200 125 172 125 Q 200 125 200 97 Z" fill="#ffffff" />
        </g>

        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="#00331b" transform="translate(5, 5)">MEDIFIND</text>
        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="#006635" transform="translate(3, 3)">MEDIFIND</text>
        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="#00994f" transform="translate(1, 1)">MEDIFIND</text>

        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="url(#textGrad)">MEDIFIND</text>
      </svg>

      <button id="enterBtn" class="enter-btn" onclick="openPlatform()">Enter Platform</button>
    </div>
  </div>


  <!-- PAGE 2: PLATFORM SCREEN (EXACT LOOK OF IMAGE 1) -->
  <div id="platform-screen" class="screen">
    <!-- Ambient Background Swooshes -->
    <div class="graphic-overlay">
      <div class="top-wave"></div>
      <div class="bottom-wave"></div>
    </div>

    <!-- Glowing Target Circle Graphic on Right -->
    <svg class="medical-target-graphic" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="90" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
      <circle cx="100" cy="100" r="75" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="100" cy="100" r="55" fill="url(#crossBgGrad)" fill-opacity="0.3" stroke="#5eead4" stroke-width="2"/>
      <!-- Glowing Center Cross -->
      <path d="M100 70 V130 M70 100 H130" stroke="#5eead4" stroke-width="14" stroke-linecap="round" />
      <path d="M100 70 V130 M70 100 H130" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
      <defs>
        <radialGradient id="crossBgGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 100) scale(55)">
          <stop stop-color="#5eead4" />
          <stop offset="1" stop-color="#0d9488" stop-opacity="0" />
        </radialGradient>
      </defs>
    </svg>

    <div class="app-container">

      <!-- HEADER LOGO + EKG WAVE -->
      <header class="brand-header-wrap">
        <div class="brand-icon-box">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
            <path d="m8.5 8.5 7 7"/>
          </svg>
        </div>

        <div class="brand-title-group">
          <h1 class="brand-title-text">MediFind</h1>
          <svg class="header-ekg-svg" viewBox="0 0 160 40" fill="none">
            <path d="M 0 26 H 25 L 32 12 L 40 34 L 48 4 L 56 30 L 62 26 H 145" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="145" cy="26" r="4" fill="#0d9488" />
          </svg>
        </div>
      </header>

      <!-- VERTICAL STEPPER COMPONENT -->
      <div class="stepper">
        <div class="stepper-line"></div>

        <!-- Step 1 (Active) -->
        <div class="step-item active">
          <div class="step-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.3.3 0 1 0 .2.3"/>
              <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
              <circle cx="20" cy="10" r="2"/>
            </svg>
          </div>
          <div class="step-capsule">
            <span class="step-label-text">Find doctor</span>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="step-item">
          <div class="step-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
          </div>
          <div class="step-capsule">
            <span class="step-label-text">Upload prescription</span>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="step-item">
          <div class="step-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
              <path d="m8.5 8.5 7 7"/>
            </svg>
          </div>
          <div class="step-capsule">
            <span class="step-label-text">Find pharmacy</span>
          </div>
        </div>

        <!-- Step 4 -->
        <div class="step-item">
          <div class="step-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="step-capsule">
            <span class="step-label-text">Confirm</span>
          </div>
        </div>
      </div>

      <!-- BOTTOM DECORATION (HEARTBEAT WAVE, MEDICAL BLOCKS & STETHOSCOPE) -->
      <div class="bottom-decor-container">
        <svg class="bottom-decor-svg" viewBox="0 0 400 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Continuous Cyan Pulse Wave across bottom -->
          <path d="M 0 100 Q 60 100 90 100 L 105 75 L 120 120 L 140 20 L 160 150 L 175 80 L 190 100 H 400" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

          <!-- 3D Medical Blocks on Left -->
          <g transform="translate(30, 45)">
            <!-- Cube 1 (Heart) -->
            <rect x="35" y="0" width="46" height="46" rx="10" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
            <path d="M58 28 C58 28 47 22 47 16 C47 13 49 11 52 11 C55 11 57 13 58 15 C59 13 61 11 64 11 C67 11 69 13 69 16 C69 22 58 28 58 28 Z" fill="#0d9488"/>
            <path d="M49 19 H53 L55 16 L58 22 L61 18 H66" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Cube 2 (Pill) -->
            <rect x="0" y="40" width="46" height="46" rx="10" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
            <path d="M15 71 L31 55 C33 53 36 53 38 55 C40 57 40 60 38 62 L22 78 C20 80 17 80 15 78 C13 76 13 73 15 71 Z" fill="#0d9488"/>
            <line x1="20" y1="66" x2="33" y2="67" stroke="#ffffff" stroke-width="1.5"/>

            <!-- Cube 3 (Cross) -->
            <rect x="52" y="40" width="46" height="46" rx="10" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
            <path d="M75 53 V73 M65 63 H85" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
          </g>

          <!-- Metallic Stethoscope Graphic on Right -->
          <g transform="translate(200, 50)">
            <!-- Tubing -->
            <path d="M 30 70 Q 60 120 120 80 T 170 30" stroke="#043832" stroke-width="10" fill="none" stroke-linecap="round"/>
            <path d="M 30 70 Q 60 120 120 80 T 170 30" stroke="#0d9488" stroke-width="6" fill="none" stroke-linecap="round"/>
            <!-- Chrome Chestpiece -->
            <circle cx="125" cy="85" r="24" fill="url(#metalGrad)" stroke="#5eead4" stroke-width="2"/>
            <circle cx="125" cy="85" r="16" fill="#043832"/>
            <circle cx="125" cy
