<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEDIFIND</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@1,900&family=Newsreader:ital,opsz,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #010603;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* LANDING SCREEN */
    #landing-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #010603;
      overflow: hidden;
      z-index: 10;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 136, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 136, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none !important;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #010603 88%);
      z-index: 2;
      pointer-events: none !important;
    }

    .ekg-container {
      position: absolute;
      width: 100%;
      height: 220px;
      top: 36%;
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: none !important;
    }

    .ekg-svg {
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
      pointer-events: none !important;
    }

    .ekg-back-line {
      stroke: rgba(255, 0, 51, 0.25);
      stroke-width: 3.5;
      fill: none;
    }

    .ekg-pulse-line {
      stroke: #ff0033;
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 250 1100;
      stroke-dashoffset: 1350;
      animation: ekgSweep 2.5s linear infinite;
    }

    @keyframes ekgSweep {
      0% { stroke-dashoffset: 1350; }
      100% { stroke-dashoffset: 0; }
    }

    .logo-wrapper {
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      pointer-events: none;
    }

    .vector-logo {
      width: 100%;
      height: auto;
      shape-rendering: geometricPrecision;
      pointer-events: none !important;
    }

    .enter-btn {
      position: relative;
      z-index: 999999 !important;
      margin-top: 12px;
      padding: 16px 48px;
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #010603;
      background: linear-gradient(180deg, #00ff88 0%, #00b85c 100%);
      border: 1.5px solid #7effc3;
      border-radius: 40px;
      cursor: pointer !important;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
      text-decoration: none;
      display: inline-block;
      text-align: center;
      pointer-events: auto !important;
      user-select: none;
      touch-action: manipulation;
    }

    /* PLATFORM SCREEN */
    #platform-screen {
      display: none;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at 85% 35%, #5eead4 0%, #14b8a6 25%, #0d9488 45%, #0f766e 70%, #042f2e 100%);
      background-attachment: fixed;
      padding: 36px 24px;
      overflow-x: hidden;
    }

    .graphic-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: relative;
      z-index: 10;
    }

    .brand-header-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon-box {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #0d9488 0%, #044e46 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(4, 47, 46, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .brand-title-text {
      font-family: 'Newsreader', serif;
      font-size: 2.35rem;
      font-weight: 700;
      color: #032b26;
    }

    .header-ekg-svg {
      flex-grow: 1;
      height: 36px;
    }

    .stepper {
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
    }

    .stepper-line {
      position: absolute;
      top: 26px;
      bottom: 26px;
      left: 25px;
      width: 2.5px;
      background: linear-gradient(to bottom, #0f766e 0%, #5eead4 50%, #0f766e 100%);
      z-index: 1;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .step-icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 2px solid #0d9488;
      color: #0d9488;
      flex-shrink: 0;
    }

    .step-item.active .step-icon-wrapper {
      background: linear-gradient(135deg, #0d9488 0%, #044e46 100%);
      border: 2.5px solid #5eead4;
      color: #ffffff;
    }

    .step-capsule {
      flex-grow: 1;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.75) 0%, rgba(240, 253, 250, 0.55) 100%);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 16px 20px;
    }

    .step-label-text {
      font-family: 'Newsreader', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 700;
      color: #043832;
      display: block;
      margin-bottom: 8px;
    }

    .interactive-content {
      display: none;
      margin-top: 10px;
      flex-direction: column;
      gap: 10px;
    }

    .step-item.active .interactive-content {
      display: flex;
    }

    select, input[type="file"], .action-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #0d9488;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      background: #ffffff;
    }

    .action-btn {
      background: #0d9488;
      color: #ffffff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }

    .action-btn:hover {
      background: #044e46;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #043832;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: LANDING PAGE -->
  <div id="landing-screen" class="screen">
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>

    <div class="ekg-container">
      <svg class="ekg-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
        <path class="ekg-back-line" d="M 0,100 H 300 L 315,85 L 330,100 H 360 L 375,25 L 395,185 L 415,10 L 435,145 L 450,100 H 490 L 505,75 L 520,100 H 680 L 695,85 L 710,100 H 740 L 755,25 L 775,185 L 795,10 L 815,145 L 830,100 H 870 L 885,75 L 900,100 H 1200" />
        <path class="ekg-pulse-line" d="M 0,100 H 300 L 315,85 L 330,100 H 360 L 375,25 L 395,185 L 415,10 L 435,145 L 450,100 H 490 L 505,75 L 520,100 H 680 L 695,85 L 710,100 H 740 L 755,25 L 775,185 L 795,10 L 815,145 L 830,100 H 870 L 885,75 L 900,100 H 1200" />
      </svg>
    </div>

    <div class="logo-wrapper">
      <svg class="vector-logo" viewBox="0 0 400 320" fill="none">
        <defs>
          <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" />
            <stop offset="100%" stop-color="#00cc6a" />
          </linearGradient>
          <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#006635" />
            <stop offset="100%" stop-color="#00331b" />
          </linearGradient>
          <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff88" />
            <stop offset="100%" stop-color="#00d672" />
          </linearGradient>
        </defs>

        <g transform="translate(48, 25) scale(0.76)">
          <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#sideGrad)" transform="translate(10, 14)" />
          <path d="M 165 30 H 235 V 90 H 295 V 160 H 235 V 220 H 165 V 160 H 105 V 90 H 165 Z" fill="url(#frontGrad)" rx="3" />
          <circle cx="200" cy="125" r="42" fill="#010603" stroke="url(#sideGrad)" stroke-width="8" transform="translate(4, 5)" />
          <circle cx="200" cy="125" r="42" fill="#010e07" stroke="#00ff88" stroke-width="7" />
          <path d="M 230 155 L 265 190" stroke="#00331b" stroke-width="16" stroke-linecap="round" transform="translate(5, 7)" />
          <path d="M 230 155 L 265 190" stroke="#00ff88" stroke-width="14" stroke-linecap="round" />
          <path d="M 200 97 Q 200 125 228 125 Q 200 125 200 153 Q 200 125 172 125 Q 200 125 200 97 Z" fill="#ffffff" />
        </g>

        <text x="200" y="275" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="46" letter-spacing="3" fill="url(#textGrad)">MEDIFIND</text>
      </svg>

      <button id="enterBtn" type="button" class="enter-btn">Enter Platform</button>
    </div>
  </div>

  <!-- SCREEN 2: PLATFORM SCREEN -->
  <div id="platform-screen" class="screen">
    <div class="graphic-overlay"></div>

    <div class="app-container">
      <header class="brand-header-wrap">
        <div class="brand-icon-box">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
            <path d="m8.5 8.5 7 7"/>
          </svg>
        </div>
        <div class="brand-title-group">
          <h1 class="brand-title-text">MediFind</h1>
          <svg class="header-ekg-svg" viewBox="0 0 160 40" fill="none">
            <path d="M 0 26 H 25 L 32 12 L 40 34 L 48 4 L 56 30 L 62 26 H 145" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </header>

      <div class="stepper">
        <div class="stepper-line"></div>

        <!-- STEP 1 -->
        <div class="step-item active" id="step-1">
          <div class="step-icon-wrapper">1</div>
          <div class="step-capsule">
            <span class="step-label-text">1. Find Doctor</span>
            <div class="interactive-content">
              <select id="doctorSelect">
                <option value="">Loading doctors from API...</option>
              </select>
              <button class="action-btn" onclick="nextStep(1)">Continue to Prescription</button>
            </div>
          </div>
        </div>

        <!-- STEP 2 -->
        <div class="step-item" id="step-2">
          <div class="step-icon-wrapper">2</div>
          <div class="step-capsule">
            <span class="step-label-text">2. Upload Prescription</span>
            <div class="interactive-content">
              <input type="file" id="prescriptionInput" accept="image/*,.pdf" />
              <button class="action-btn" onclick="uploadPrescription()">Upload File</button>
              <p id="uploadStatus" class="status-msg"></p>
            </div>
          </div>
        </div>

        <!-- STEP 3 -->
        <div class="step-item" id="step-3">
          <div class="step-icon-wrapper">3</div>
          <div class="step-capsule">
            <span class="step-label-text">3. Find Pharmacy</span>
            <div class="interactive-content">
              <select id="pharmacySelect">
                <option value="">Loading pharmacies from API...</option>
              </select>
              <button class="action-btn" onclick="nextStep(3)">Continue to Confirm</button>
            </div>
          </div>
        </div>

        <!-- STEP 4 -->
        <div class="step-item" id="step-4">
          <div class="step-icon-wrapper">4</div>
          <div class="step-capsule">
            <span class="step-label-text">4. Confirm Order</span>
            <div class="interactive-content">
              <p id="summaryText" class="status-msg">Review details and confirm.</p>
              <button class="action-btn" onclick="submitBooking()">Confirm Order</button>
              <p id="confirmStatus" class="status-msg"></p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';
    let state = { doctorId: null, prescriptionFile: null, pharmacyId: null };

    // Navigation Switch
    document.getElementById('enterBtn').onclick = () => {
      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('platform-screen').style.display = 'flex';
      loadDoctors();
    };

    // Step 1: Fetch Doctors
    async function loadDoctors() {
      try {
        const res = await fetch(`${API_BASE}/doctors`);
        const data = await res.json();
        const select = document.getElementById('doctorSelect');
        select.innerHTML = data.doctors.map(d => `<option value="${d.id}">${d.name} (${d.specialty}) - ${d.rating}</option>`).join('');
      } catch (err) {
        document.getElementById('doctorSelect').innerHTML = `<option>Error connecting to server</option>`;
      }
    }

    // Step 2: Upload File
    async function uploadPrescription() {
      const fileInput = document.getElementById('prescriptionInput');
      const status = document.getElementById('uploadStatus');

      if (!fileInput.files[0]) {
        status.textContent = 'Please choose a file first.';
        return;
      }

      const formData = new FormData();
      formData.append('prescription', fileInput.files[0]);

      status.textContent = 'Uploading...';
      try {
        const res = await fetch(`${API_BASE}/upload-prescription`, { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          state.prescriptionFile = data.filename;
          status.textContent = 'Upload successful!';
          setTimeout(() => { loadPharmacies(); nextStep(2); }, 800);
        }
      } catch (err) {
        status.textContent = 'Upload failed.';
      }
    }

    // Step 3: Fetch Pharmacies
    async function loadPharmacies() {
      try {
        const res = await fetch(`${API_BASE}/pharmacies`);
        const data = await res.json();
        const select = document.getElementById('pharmacySelect');
        select.innerHTML = data.pharmacies.map(p => `<option value="${p.id}">${p.name} - ${p.distance} (${p.status})</option>`).join('');
      } catch (err) {
        document.getElementById('pharmacySelect').innerHTML = `<option>Error fetching pharmacies</option>`;
      }
    }

    // Move Stepper Progress
    function nextStep(currentStepNumber) {
      if (currentStepNumber === 1) {
        state.doctorId = document.getElementById('doctorSelect').value;
      } else if (currentStepNumber === 3) {
        state.pharmacyId = document.getElementById('pharmacySelect').value;
      }

      document.getElementById(`step-${currentStepNumber}`).classList.remove('active');
      document.getElementById(`step-${currentStepNumber + 1}`).classList.add('active');
    }

    // Step 4: Submit to API
    async function submitBooking() {
      const status = document.getElementById('confirmStatus');
      status.textContent = 'Processing request...';

      try {
        const res = await fetch(`${API_BASE}/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        const data = await res.json();
        if (data.success) {
          status.style.color = '#00ff88';
          status.textContent = `Success! Ref ID: ${data.bookingId}`;
        }
      } catch (err) {
        status.textContent = 'Submission failed.';
      }
    }
  </script>
</body>
</html>
