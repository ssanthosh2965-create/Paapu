<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediFind — Sign In</title>
<style>
  :root{
    --bg: #05080d;
    --panel: #0c1119;
    --panel-border: #1b2430;
    --cyan: #29d9f5;
    --teal: #21e8b0;
    --red: #ef3b3b;
    --text: #eaf6f6;
    --muted: #7d8b94;
    --focus: #4be8ff;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(41,217,245,0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(33,232,176,0.06), transparent 40%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }

  .screen{
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 40px;
  }

  /* ---- compact logo mark, echoes the splash screen ---- */
  .mark{
    width: 84px;
    height: 84px;
    margin-bottom: 18px;
    position: relative;
  }
  .mark svg{ width: 100%; height: 100%; }

  .brand{
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .brand span.find{ color: var(--teal); }
  .brand span.medi{ color: var(--cyan); }

  .tagline{
    margin: 4px 0 28px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---- card ---- */
  .card{
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 26px 24px 24px;
  }

  .card h1{
    font-size: 19px;
    margin: 0 0 4px;
    font-weight: 700;
  }
  .card p.sub{
    margin: 0 0 22px;
    font-size: 13px;
    color: var(--muted);
  }

  .field{
    margin-bottom: 16px;
  }
  .field label{
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .field input{
    width: 100%;
    padding: 13px 14px;
    background: #0a0f16;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color: #4c5761; }
  .field input:focus{
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(75,232,255,0.15);
  }

  .row-between{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: -6px 0 20px;
  }
  .remember{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .remember input{ accent-color: var(--teal); width: 15px; height: 15px; }

  .forgot{
    font-size: 13px;
    color: var(--cyan);
    text-decoration: none;
  }
  .forgot:hover{ text-decoration: underline; }

  .btn-primary{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #04141a;
    background: linear-gradient(90deg, var(--cyan), var(--teal));
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary:active{ transform: scale(0.98); }

  .error{
    display: none;
    font-size: 13px;
    color: #ffb4b4;
    background: rgba(239,59,59,0.08);
    border: 1px solid rgba(239,59,59,0.35);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 16px;
  }
  .error.show{ display: block; }

  .divider{
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 18px;
    color: var(--muted);
    font-size: 12px;
  }
  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--panel-border);
  }

  .emergency-btn{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(239,59,59,0.4);
    background: rgba(239,59,59,0.06);
    color: var(--red);
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.4px;
    text-decoration: none;
    cursor: pointer;
  }
  .emergency-btn:hover{ background: rgba(239,59,59,0.12); }
  .emergency-btn .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 0 rgba(239,59,59,0.6);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(239,59,59,0.55); }
    70%{ box-shadow: 0 0 0 8px rgba(239,59,59,0); }
    100%{ box-shadow: 0 0 0 0 rgba(239,59,59,0); }
  }

  .signup{
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .signup a{
    color: var(--teal);
    text-decoration: none;
    font-weight: 600;
  }
  .signup a:hover{ text-decoration: underline; }

  @media (prefers-reduced-motion: reduce){
    .emergency-btn .dot{ animation: none; }
  }
</style>
</head>
<body>
<div class="screen">

  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#29d9f5" stroke-width="1.6" stroke-dasharray="3 4"/>
      <path d="M42 12 H58 V38 H86 V54 H58 V82 H42 V54 H12 V38 H42 Z"
            fill="none" stroke="#21e8b0" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="12" fill="none" stroke="#ef3b3b" stroke-width="3"/>
      <path d="M45 50 L49 42 L52 54 L55 47" fill="none" stroke="#ef3b3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h2 class="brand"><span class="medi">MEDI</span><span class="find">FIND</span></h2>
  <div class="tagline">Healthcare. Discovered.</div>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to find care near you.</p>

    <div class="error" id="formError">Enter a valid email/phone and password.</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="identifier">Email or phone</label>
        <input type="text" id="identifier" name="identifier" placeholder="you@example.com" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Keep me signed in
        </label>
        <a href="#" class="forgot">Forgot?</a>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="divider">or</div>

    <a href="#" class="emergency-btn" id="emergencyLink">
      <span class="dot"></span> Skip login — Emergency access
    </a>

    <p class="signup">New to MediFind? <a href="#">Create an account</a></p>
  </div>

</div>

<script>
  // Standalone logic — no dependency on the main index page.
  // Replace the submit handler with a real auth call when ready.
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('formError');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const id = document.getElementById('identifier').value.trim();
    const pw = document.getElementById('password').value;

    if(!id || pw.length < 4){
      errorBox.classList.add('show');
      return;
    }
    errorBox.classList.remove('show');

    // TODO: hook this up to your auth endpoint.
    // On success, redirect back to the main app, e.g.:
    // window.location.href = "index.html";
    alert('Signed in as ' + id + ' (wire this up to your backend)');
  });

  document.getElementById('emergencyLink').addEventListener('click', function(e){
    e.preventDefault();
    // TODO: point this at your emergency flow / dial page.
    alert('Emergency access flow goes here');
  });
</script>
</body>
</html>
